# The stack from DRIFT.md. One command starts everything; memory limits are the design
# constraint on 8 GB; nothing but the tunnel faces the street. Copy .env.example to .env.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# WAL-G (DRIFT §5): where the archive lives, spoken S3 to R2. R2_ENDPOINT overrides the
# endpoint for an S3 stand-in in development. Without credentials nothing is archived.
x-walg: &walg
  WALG_S3_PREFIX: s3://${R2_BACKUP_BUCKET:-byd-backup}/wal-g
  AWS_ENDPOINT: ${R2_ENDPOINT:-https://${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com}
  AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  AWS_REGION: auto
  AWS_S3_FORCE_PATH_STYLE: "true"
  WALG_DELTA_MAX_STEPS: "0"

services:
  # Postgres with WAL-G in the image (ops/Dockerfile.postgres): every finished WAL segment goes
  # to R2 within a minute (DRIFT §5). The same image is the backup agent below.
  postgres:
    build:
      context: ops
      dockerfile: Dockerfile.postgres
    image: ${BYD_POSTGRES_IMAGE:-byd-postgres:${BYD_TAG:-latest}}
    command: postgres -c wal_level=replica -c archive_mode=on -c archive_command=/usr/local/bin/archive.sh\ %p -c archive_timeout=60
    environment:
      <<: *walg
      POSTGRES_DB: byd
      POSTGRES_USER: byd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Reachable from the box only (admin over Tailscale + SSH, DRIFT §10), never from the street.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byd -d byd"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1500m
    restart: unless-stopped
    <<: *logging

  app:
    build: .
    # With BYD_REGISTRY set (ghcr.io/owner/repo), deploy.sh pulls CI's image for the SHA instead.
    image: ${BYD_APP_IMAGE:-byd-app:${BYD_TAG:-latest}}
    environment:
      DATABASE_URL: postgres://byd:${POSTGRES_PASSWORD:-byd}@postgres:5432/byd
      PORT: "8080"
      IDLE_EVICT_MS: ${IDLE_EVICT_MS:-1800000}
      IDLE_END_MS: ${IDLE_END_MS:-86400000}
      # Assets in R2 (DRIFT §4): with credentials, textures are served as signed links.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ASSETS_BUCKET: ${R2_ASSETS_BUCKET:-byd-assets}
    # The tunnel reaches the app on the compose network; this host port is for the box itself.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    <<: *logging

  render:
    build:
      context: .
      dockerfile: Dockerfile.render
    image: ${BYD_RENDER_IMAGE:-byd-render:${BYD_TAG:-latest}}
    environment:
      DATABASE_URL: postgres://byd:${POSTGRES_PASSWORD:-byd}@postgres:5432/byd
      # The worker writes its outputs where the app serves them from (DRIFT §4).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ASSETS_BUCKET: ${R2_ASSETS_BUCKET:-byd-assets}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 2g
    shm_size: 512m
    restart: unless-stopped
    <<: *logging

  # Cloudflare Tunnel (DRIFT §2): no open ports at home. Needs CLOUDFLARE_TUNNEL_TOKEN; the
  # tunnel's public hostname routes to http://app:8080 in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

  # Backup (DRIFT §5): a nightly base backup with WAL-G over the data volume, the last
  # BACKUP_KEEP kept with their WAL; ops/restore-test.sh rehearses a restore in this image.
  backup:
    image: ${BYD_POSTGRES_IMAGE:-byd-postgres:${BYD_TAG:-latest}}
    command: /usr/local/bin/backup.sh loop
    environment:
      <<: *walg
      PGHOST: postgres
      PGUSER: byd
      PGPASSWORD: ${POSTGRES_PASSWORD:-byd}
      PGDATABASE: byd
      PGDATA: /var/lib/postgresql/data
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backup"]
    mem_limit: 256m
    restart: unless-stopped
    <<: *logging

volumes:
  pgdata:
