# CI checks pull requests, a tag builds the images, the box fetches (DRIFT §7). A pull request
# gets lint, typecheck, every test against a real Postgres and a real Chromium, the replay
# corpus as the gate, and the images built but not pushed. main is the trunk and runs no workflow
# at all; the pre-push hook in .githooks/ is what stands in front of it. Pushing a v-tag builds
# images to GHCR tagged with the git SHA and the release name, which ops/deploy.sh on the box
# pulls. CI has no way into the house.
name: ci

on:
  pull_request:
  push:
    tags: ["v*"]
  # Build an image for a commit you have not tagged, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The check is split into jobs that run side by side (#1125). As one job it took 35–40 minutes:
  # the e2e suite 19, the web suite 10, and up to 8 waiting on apt for Playwright's packages, all
  # in a row on a public repository whose runners cost nothing. `check` at the bottom is still the
  # one answer a pull request gets. Playwright's own image was tried and measured with other fonts
  # than the runner's (ci-browser.test.ts), so every job stays on the runner.
  static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - name: replay corpus is the gate
        run: pnpm --filter @byd/engine exec vitest run test/corpus.test.ts

  # Every suite but the two large ones, in the order `pnpm test` runs them.
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services: &postgres
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: byd
          POSTGRES_USER: byd
          POSTGRES_PASSWORD: byd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U byd -d byd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env: &database
      DATABASE_URL: postgres://byd:byd@127.0.0.1:5432/byd
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      - run: pnpm -r --workspace-concurrency=1 --filter '!@byd/web' --filter '!@byd/e2e' test

  web:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services: *postgres
    env: *database
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      - run: pnpm --filter @byd/web exec vitest run --shard=${{ matrix.shard }}/3

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services: *postgres
    env: *database
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      # Each shard builds and stands up its own stack; the build is seconds, the suite is minutes.
      - run: pnpm --filter @byd/e2e exec playwright test --shard=${{ matrix.shard }}/4
      # The config keeps a trace, a video and a screenshot of what failed, and nothing else. They
      # are only worth keeping if they leave the runner.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.shard }}
          path: packages/e2e/test-results
          retention-days: 14

  # The one answer: red if any part of the check is, and skipped with them on a tag.
  check:
    if: always() && github.event_name == 'pull_request'
    needs: [static, unit, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} web=${{ needs.web.result }} e2e=${{ needs.e2e.result }}"
          exit 1

  images:
    # A tag is cut from a commit that was already green as a pull request, so this does not
    # re-run check; the pre-push hook keeps the trunk green in between.
    #
    # It builds on a pull request too, and pushes nothing there. Until 2026-09-16 it did not, and
    # a Dockerfile that could not build the web app sat on the trunk through nineteen commits:
    # `vite.config.ts` imports the run's own reporter from `test-support/` (#111) and the build
    # context carried only `packages/`. Nothing ran the build until a release was cut, so the
    # first thing that noticed was the release itself. A green pull request now means an image.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            dockerfile: Dockerfile
          - name: render
            context: .
            dockerfile: Dockerfile.render
          - name: postgres
            context: ops
            dockerfile: ops/Dockerfile.postgres
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A registry repository name must be lowercase; the GitHub owner is not
      # necessarily so. Lowercase it once here rather than in every tag.
      - name: the repository name in lowercase
        run: |
          echo "image_repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The box is amd64 (DRIFT); add linux/arm64 here the day it is not.
          platforms: linux/amd64
          # A pull request proves the image builds; only a tag or a dispatch publishes one.
          push: ${{ github.event_name != 'pull_request' }}
          # The SHA is the identity deploy.sh pulls by. The release name rides along on a tag
          # build so a human can read the registry. No `latest`: nothing consumes it, and a
          # manual build would move it onto a commit that was never released.
          tags: |
            ghcr.io/${{ env.image_repo }}/${{ matrix.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/{1}:{2}', env.image_repo, matrix.name, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
