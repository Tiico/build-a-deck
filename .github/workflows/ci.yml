# CI checks pull requests, a tag builds the images, the box fetches (DRIFT §7). A pull request
# gets lint, typecheck, every test against a real Postgres and a real Chromium, and the replay
# corpus as the gate. main is the trunk and runs no workflow at all; the pre-push hook in
# .githooks/ is what stands in front of it. Pushing a v-tag builds images to GHCR tagged with the
# git SHA and the release name, which ops/deploy.sh on the box pulls. CI has no way into the house.
name: ci

on:
  pull_request:
  push:
    tags: ["v*"]
  # Build an image for a commit you have not tagged, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: byd
          POSTGRES_USER: byd
          POSTGRES_PASSWORD: byd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U byd -d byd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/render
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://byd:byd@127.0.0.1:5432/byd
      - name: replay corpus is the gate
        run: pnpm --filter @byd/engine exec vitest run test/corpus.test.ts

  images:
    # A tag is cut from a commit that was already green as a pull request, so this does not
    # re-run check; the pre-push hook keeps the trunk green in between.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            dockerfile: Dockerfile
          - name: render
            context: .
            dockerfile: Dockerfile.render
          - name: postgres
            context: ops
            dockerfile: ops/Dockerfile.postgres
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A registry repository name must be lowercase; the GitHub owner is not
      # necessarily so. Lowercase it once here rather than in every tag.
      - name: the repository name in lowercase
        run: |
          echo "image_repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The box is amd64 (DRIFT); add linux/arm64 here the day it is not.
          platforms: linux/amd64
          push: true
          # The SHA is the identity deploy.sh pulls by. The release name rides along on a tag
          # build so a human can read the registry. No `latest`: nothing consumes it, and a
          # manual build would move it onto a commit that was never released.
          tags: |
            ghcr.io/${{ env.image_repo }}/${{ matrix.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/{1}:{2}', env.image_repo, matrix.name, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
