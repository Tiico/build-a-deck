<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deckster</title>
    <!-- The product's face (A6, #1082): Deckster's hand, three cards in amber, green and paper, drawn by scripts/brand-icons.ts. -->
    <meta name="description" content="Bygg ett kortspel, spela det runt en TV med telefoner som händer, och se vad som behöver ändras." />
    <meta name="theme-color" content="#14161c" />
    <!-- What a shared link shows (#1084). The pictures are named by their path; the server writes PUBLIC_ORIGIN in front as it sends the page, since a previewer wants an absolute address (packages/server/src/share.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deckster" />
    <meta property="og:title" content="Deckster" />
    <meta property="og:description" content="Bygg ett kortspel, spela det runt en TV med telefoner som händer, och se vad som behöver ändras." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Decksters hand: tre kort i bärnsten, grönt och papper, bredvid namnet Deckster." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body, #root { margin: 0; height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
