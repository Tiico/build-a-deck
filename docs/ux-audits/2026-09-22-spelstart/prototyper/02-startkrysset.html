<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Prototyp 02 — Hur designern säger att en åtgärd körs vid spelstart</title>
<link rel="stylesheet" href="proto.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="shell">
  <header>
    <a class="home" href="index.html">Spelstart</a>
    <strong>«Körs vid spelstart»</strong>
    <span class="saved">zonpanelen i fliken Bord, 320 px</span>
    <span class="spacer"></span>
    <div class="switch" id="variant">
      <button type="button" data-v="nu" aria-pressed="true">Nu</button>
      <button type="button" data-v="a">A · Kryssrutan</button>
      <button type="button" data-v="b">B · Två rubriker</button>
      <button type="button" data-v="c">C · Ratten i meningen</button>
    </div>
  </header>
  <div class="protorad">
    <p id="text"></p>
    <p class="sagt" id="vtext"></p>
    <div class="matt" id="matt"></div>
  </div>
  <main class="kolumnruta" id="ruta"></main>
</div>

<script type="module">
// Draghögen i ett spel med tre åtgärder. Meningarna är produktens egna, ordagrant ur
// `sv.editor.ts`; rattarna i dem är inte klickbara här, för det är inte de som prövas.
const HOG = 'Draghög'
const ATGARDER = [
  { id: 'a1', namn: 'Blanda', start: true, steg: ['Blanda högen'] },
  { id: 'a2', namn: 'Ge alla en starthand', start: true, steg: ['Blanda högen', 'Dela ut 5 till varje hand, nedvända'] },
  { id: 'a3', namn: 'Fyll på marknaden', start: false, steg: ['Ta 4 från högen och lägg dem uppvända till höger om högen'] },
]

const VARIANT = {
  nu: 'Nu · Panelen har en rubrik, och den säger när åtgärderna körs: «När någon klickar på högen kan de välja». Det finns ingen annan tidpunkt att välja, så «Blanda» måste tryckas av en människa vid varje bord, varje gång.',
  a: 'A · En kryssruta i åtgärden. Billigast: samma meningar, samma kompilator, en rad till per åtgärd. Men krysset är binärt — en åtgärd som körs vid start syns alltid också i högens ring — och panelens rubrik ljuger då för de ikryssade: de körs inte bara «när någon klickar på högen».',
  b: 'B · Två rubriker. Rubriken är redan meningen som säger när något händer, så panelen får en till: «Vid spelstart» över «När någon klickar på högen kan de välja». Åtgärden flyttas mellan dem. Läses bäst av alla tre — men en åtgärd kan bara stå under en rubrik, så «blanda vid start och när någon ber om det» måste skrivas två gånger.',
  c: 'C · Ratten i meningen. K21 säger att rattarna sitter inne i texten; det här är samma regel på tidpunkten. Varje åtgärd bär en mening: «Körs vid spelstart och när någon ber om det». Klicka på ratten för att byta mellan de tre värdena. Dyrast i höjd — en rad per åtgärd som aldrig är tom — men det enda förslaget där alla tre lägena går att säga, och det enda som håller ihop med hur allt annat i panelen ställs in.',
}

const RATT = {
  bara: 'bara när någon ber om det',
  bada: 'vid spelstart och när någon ber om det',
  start: 'bara vid spelstart',
}
const ORDNING = ['bara', 'bada', 'start']

const q = new URLSearchParams(location.search)
let variant = q.get('v') ?? 'nu'
const lage = new Map(ATGARDER.map((a) => [a.id, a.start ? 'bada' : 'bara']))

const el = (tag, cls) => {
  const n = document.createElement(tag)
  if (cls) n.className = cls
  return n
}

function atgard(a) {
  const box = el('div', 'byd-zone-action')
  const namn = el('input')
  namn.value = a.namn
  namn.setAttribute('aria-label', `Namn för ${a.namn}`)
  box.append(namn)

  if (variant === 'a') {
    const l = el('label', 'start-kryss')
    const i = el('input')
    i.type = 'checkbox'
    i.checked = lage.get(a.id) !== 'bara'
    i.addEventListener('change', () => { lage.set(a.id, i.checked ? 'bada' : 'bara'); rita() })
    l.append(i, document.createTextNode('Körs vid spelstart'))
    box.append(l)
  }
  if (variant === 'c') {
    const p = el('p', 'byd-sentence')
    const b = el('button', 'byd-slot')
    b.type = 'button'
    b.textContent = RATT[lage.get(a.id)]
    b.addEventListener('click', () => {
      lage.set(a.id, ORDNING[(ORDNING.indexOf(lage.get(a.id)) + 1) % ORDNING.length])
      rita()
    })
    p.append(document.createTextNode('Körs '), b)
    box.append(p)
  }

  const ol = el('ol')
  for (const s of a.steg) {
    const li = el('li')
    const span = el('span', 'byd-sentence')
    span.textContent = s
    const x = el('button', 'byd-zone-action-x')
    x.type = 'button'
    x.textContent = '×'
    li.append(span, x)
    ol.append(li)
  }
  box.append(ol)

  const add = el('label', 'byd-zone-step-add')
  const sel = el('select')
  for (const v of ['…och sedan', 'Ta … från högen', 'Dela ut …', 'Leta fram …', 'Blanda högen', 'Vänd översta kortet', 'Flytta hela högen']) {
    const o = document.createElement('option')
    o.textContent = v
    sel.append(o)
  }
  add.append(sel)
  box.append(add)

  if (variant === 'b') {
    const f = el('button', 'flytta')
    f.type = 'button'
    f.textContent = lage.get(a.id) === 'start' ? '↓ Flytta till klick på högen' : '↑ Flytta till spelstart'
    f.addEventListener('click', () => { lage.set(a.id, lage.get(a.id) === 'start' ? 'bara' : 'start'); rita() })
    box.append(f)
  }
  return box
}

function panel() {
  const p = el('div', 'byd-zone-actions')
  const head = el('header')
  const x = el('button')
  x.type = 'button'
  x.textContent = '×'
  head.append(x)
  const body = el('div', 'byd-zone-actions-body')

  const fill = el('p', 'byd-sentence')
  const z = el('b')
  z.textContent = HOG
  const w = el('button', 'byd-slot')
  w.type = 'button'
  w.textContent = 'korten där typ är Bas'
  fill.append(document.createTextNode('I '), z, document.createTextNode(' börjar '), w, document.createTextNode('.'))
  body.append(fill)

  if (variant === 'b') {
    const h1 = el('h3')
    h1.dataset.start = 'true'
    h1.textContent = 'Vid spelstart'
    body.append(h1)
    const vid = ATGARDER.filter((a) => lage.get(a.id) === 'start')
    if (vid.length === 0) {
      const t = el('p', 'tom')
      t.textContent = 'Ingenting händer med den här högen när spelet startar.'
      body.append(t)
    }
    for (const a of vid) body.append(atgard(a))
    const h2 = el('h3')
    h2.textContent = 'När någon klickar på högen kan de välja'
    body.append(h2)
    for (const a of ATGARDER.filter((x2) => lage.get(x2.id) !== 'start')) body.append(atgard(a))
  } else {
    const h = el('h3')
    h.textContent = 'När någon klickar på högen kan de välja'
    body.append(h)
    for (const a of ATGARDER) body.append(atgard(a))
  }

  const ny = el('button', 'byd-zone-action-new')
  ny.type = 'button'
  ny.textContent = '＋ Åtgärd'
  body.append(ny)
  p.append(head, body)
  return p
}

function rita() {
  for (const b of document.querySelectorAll('#variant button')) b.setAttribute('aria-pressed', String(b.dataset.v === variant))
  document.getElementById('text').textContent = `Zonpanelen för ${HOG} med tre åtgärder, i kolumnens egna 320 px. Kryss, rattar och flyttknappar går att använda: panelen ritas om vid varje klick.`
  document.getElementById('vtext').textContent = VARIANT[variant]

  const ruta = document.getElementById('ruta')
  ruta.textContent = ''
  // «Nu» står alltid kvar bredvid förslaget: kostnaden i höjd är svår att läsa i ett tal och
  // lätt att läsa mot samma panel utan tillägget.
  if (variant !== 'nu') {
    const varit = variant
    variant = 'nu'
    const ref = el('div', 'kolumn')
    ref.dataset.ref = 'true'
    ref.append(panel())
    const rcap = document.createElement('figcaption')
    rcap.textContent = 'Nu · samma hög, samma tre åtgärder'
    ref.append(rcap)
    ruta.append(ref)
    variant = varit
  }
  const kol = el('div', 'kolumn')
  kol.append(panel())
  const cap = document.createElement('figcaption')
  const sagt = ATGARDER.filter((a) => lage.get(a.id) !== 'bara').map((a) => a.namn)
  cap.textContent = sagt.length === 0 ? 'Ingen åtgärd körs vid start.' : `Vid start körs: ${sagt.join(', ')}.`
  kol.append(cap)
  ruta.append(kol)

  const matt = document.getElementById('matt')
  matt.textContent = ''
  const hojd = matHojd(variant)
  const rad = (namn, v) => {
    const s = el('span')
    const u = document.createElement('u')
    u.textContent = v
    s.append(document.createTextNode(`${namn} `), u)
    matt.append(s)
  }
  rad('panelens innehåll', `${hojd} px`)
  rad('tre åtgärder kostar', `${hojd - BAS} px mer än i dag`)
}

// Höjden mäts på en panel som inte är inklämd i kolumnens flexhöjd: en panel som fyller sin
// kolumn svarar med kolumnens höjd och inte med innehållets, och då blir varje förslag lika högt.
// Lådan ligger utanför skärmen och plockas bort så fort måttet är taget.
function matHojd(v) {
  const varit = variant
  variant = v
  const lada = el('div')
  Object.assign(lada.style, { position: 'absolute', left: '-10000px', top: '0', width: '320px' })
  const p = panel()
  p.style.height = 'auto'
  lada.append(p)
  document.body.append(lada)
  const h2 = p.querySelector('.byd-zone-actions-body').scrollHeight
  lada.remove()
  variant = varit
  return h2
}

// Basen mäts på «Nu», så att varje förslags kostnad går att läsa i samma tal.
const BAS = matHojd('nu')
rita()

document.getElementById('variant').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  variant = b.dataset.v
  for (const a of ATGARDER) lage.set(a.id, a.start ? (variant === 'b' ? 'start' : 'bada') : 'bara')
  rita()
})
addEventListener('resize', rita)
</script>
</body>
</html>
