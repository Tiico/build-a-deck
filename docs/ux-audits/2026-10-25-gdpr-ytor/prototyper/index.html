<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp — GDPR-ytorna (#1280, #1281)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan ──────────────────────────────────────────────────────────────────────────────
     #1280: kontot laddar ner sina uppgifter och raderar sig i Profil.
     #1281: gästens väg — meningen, radering från telefonen, hur en maskad plats syns.
     Besluten som ligger fast (G6, #1269): Deckster är ansvarig; ett raderat konto försvinner
     direkt och dess assets sopas efter 30 dygn; en gäst raderar själv med sin token eller via
     Kontakt; en gäst utan konto maskas efter 12 månader; backuperna lever åtta dygn.
     Varje yta är ritad för hand med kontots och telefonens egna färger och mått (account.css,
     profile.css, player.css, join.css) och produktens egna strängar där de finns.
     PROTOTYP. Slängs när beslutet står i DESIGN-BESLUT.md.
     ────────────────────────────────────────────────────────────────────────────────────── */
  body { display: flex; flex-direction: column; min-height: 100vh; overflow: auto; }
  .protorad { position: relative; z-index: 20; }
  .protorad .flikar { display: flex; gap: 4px; flex-wrap: wrap; }
  .protorad .flikar button[aria-pressed='true'] { background: #ffd98a; color: #2a2417; }
  .protorad .grupp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .protorad .grupp > span { color: #c8b98d; }
  .protorad .grupp[hidden] { display: none; }
  main.scen { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 28px; justify-content: safe center; align-content: start; align-items: start; padding: 20px 16px 60px; background: #15171c; }
  .ram { display: grid; gap: 6px; }
  .sida { position: relative; outline: 1px solid #3a3f4b; box-shadow: 0 10px 40px rgb(0 0 0 / 45%); overflow: hidden; }
  .sida[data-bredd='dator'] { width: 1040px; min-height: 680px; }
  .sida[data-bredd='375'] { width: 375px; min-height: 740px; }
  .sida[data-bredd='320'] { width: 320px; min-height: 568px; }
  .sida[data-fast][data-bredd='375'] { height: 740px; }
  .sida[data-fast][data-bredd='320'] { height: 568px; }
  .sida[data-bredd='tv'] { width: 640px; min-height: 300px; }
  .etikett { color: var(--quiet-2); font-size: 11px; margin: 0; }
  .etikett b { color: #e6ecfa; }

  /* ── Glyfer ─────────────────────────────────────────────────────────────────────────────── */
  .g { width: 16px; height: 16px; flex: none; }
  .med { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

  /* ── Kontot (account.css, profile.css, buttons.css) ───────────────────────────────────────── */
  .acc { --bg: #0f1117; --card: #171a23; --field: #14161c; --edge: #262a35; --muted: #9aa3b8; --soft: #c3cbdd; --ok: #7dd3a0; --ok-ink: #0b2a18; --sec-line: #6f7a90; --sec-ink: #dce3f2;
    min-height: inherit; background: var(--bg); color: #e6e6e6; font: 14px system-ui, sans-serif; box-sizing: border-box; position: relative; }
  .acc :focus-visible { outline: 3px solid #9cc6ff; outline-offset: 2px; }
  .acc button { font: inherit; cursor: pointer; }
  .prim { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--ok); color: var(--ok-ink); font-weight: 700 !important; }
  .sek { min-height: 44px; padding: 0 16px; border: 1px solid var(--sec-line); border-radius: 10px; background: transparent; color: var(--sec-ink); font-weight: 600 !important; font-size: 14px; }
  .sek:disabled, .prim:disabled { opacity: .45; cursor: default; }
  .farlig { min-height: 44px; padding: 0 16px; border: 1px solid #7a3243; border-radius: 10px; background: #7a3243; color: #ffe4ea; font-weight: 700 !important; }
  .farlig:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
  .acc.topp { padding: 40px 20px; display: grid; justify-content: center; align-content: start; }
  .sida:not([data-bredd='dator']) .acc.topp { padding: 16px 16px 32px; }
  .profil { width: 640px; display: grid; gap: 16px; }
  .sida[data-bredd='375'] .profil { width: 343px; }
  .sida[data-bredd='320'] .profil { width: 288px; }
  .tillbaka { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 44px; color: var(--muted); font-size: 14px; }
  .profil-head { display: grid; gap: 4px; margin-bottom: 8px; }
  .profil-head h1 { margin: 0; font-size: 28px; }
  .profil-head p { overflow-wrap: anywhere; }
  .pkort { display: grid; gap: 12px; padding: 24px; border-radius: 16px; border: 1px solid var(--edge); background: var(--card); color: #e6ecfa; font-size: 14px; }
  .sida:not([data-bredd='dator']) .pkort { padding: 16px; }
  .pkort h2 { margin: 0; font-size: 18px; font-weight: 750; }
  .pkort h3 { margin: 4px 0 0; font-size: 15px; font-weight: 700; }
  .pkort[data-ihop] { opacity: .55; }
  .pkort[data-ihop] h2::after { content: ' · befintligt kort'; color: #6b7387; font-size: 12px; font-weight: 500; }
  .lead { margin: 0; line-height: 1.5; color: var(--soft); }
  .liten { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .rad { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .skiljare { height: 1px; background: var(--edge); margin: 4px 0; }
  .okrad { margin: 0; display: flex; gap: 10px; align-items: flex-start; color: #d8ffe8; font-size: 13px; line-height: 1.5; }
  .bock { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--ok); color: #0b2a18; font-size: 13px; font-weight: 800; }
  .about { margin: 8px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
  .about u { text-underline-offset: 3px; }
  .falt { display: grid; gap: 8px; font-size: 13px; }
  .falt > span { font-weight: 650; }
  .falt input { min-height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--sec-line); background: var(--field); color: #fff; font: inherit; font-size: 14px; padding: 0 12px; width: 100%; }
  /* L9:s remsa: bärnstensgrund, det säkra svaret först och med fokus, det som inte kan ångras i rött och i ord. */
  .fraga { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; background: #3b3222; color: #ffeccc; }
  .fraga > div { flex: 1 1 240px; display: grid; gap: 6px; line-height: 1.45; }
  .fraga p { margin: 0; }
  .fraga ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
  .fraga button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #a39a86; background: transparent; color: var(--sec-ink); font-weight: 600; }
  .fraga button[data-kind='danger'] { border-color: #7a3243; background: #7a3243; color: #ffe4ea; font-weight: 700; }
  .fraga .avbryt { box-shadow: 0 0 0 3px #9cc6ff; }
  /* Radera-sidan (B) och dialogen (C) */
  .steg { display: grid; gap: 10px; }
  .steg > h2 { display: flex; gap: 10px; align-items: baseline; }
  .steg > h2 i { font-style: normal; color: var(--muted); font-size: 14px; font-weight: 600; }
  .spellista { list-style: none; margin: 0; padding: 0; display: grid; }
  .spellista > li { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--edge); }
  .spellista > li:first-child { border-top: 0; padding-top: 0; }
  .spellista b { font-size: 15px; }
  .spellista .vad { color: var(--muted); font-size: 13px; }
  .spellista .ut { color: #ffb4c4; font-size: 13px; }
  .spellista .kvar { color: var(--ok); font-size: 13px; }
  .val { display: grid; gap: 4px; }
  .val label { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid var(--sec-line); border-radius: 8px; cursor: pointer; }
  .val label:has(input:checked) { box-shadow: inset 0 -3px 0 var(--ok); }
  .val input { accent-color: var(--ok); width: 16px; height: 16px; margin: 0; }
  .forsvinner { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--soft); line-height: 1.45; }
  .farokort { border-color: #4a2a33; }
  .skymning { position: absolute; inset: 0; z-index: 5; display: grid; place-items: start center; padding: 60px 16px; background: rgb(5 7 12 / 72%); }
  .dialog { width: min(480px, 100%); box-sizing: border-box; display: grid; gap: 14px; padding: 24px; border-radius: 20px; background: var(--card); border: 1px solid #343a4a; box-shadow: 0 20px 60px rgb(0 0 0 / 60%); }
  .sida:not([data-bredd='dator']) .dialog { padding: 18px; }
  .dialog h2 { margin: 0; font-size: 20px; }
  .dialog .knappar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .skickat { padding: 16px; border-radius: 14px; background: #1b2a22; color: #d8ffe8; display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
  .skickat strong { font-size: 16px; }
  .forlopp { height: 6px; border-radius: 3px; background: #262a35; overflow: hidden; }
  .forlopp i { display: block; height: 100%; width: 60%; background: var(--ok); }
  /* Utdraget */
  .fil { display: grid; gap: 14px; }
  .trad { margin: 0; padding: 14px 16px; border-radius: 12px; background: #11141b; border: 1px solid var(--edge); font: 13px/1.6 ui-monospace, Menlo, monospace; color: #c3cbdd; white-space: pre; overflow-x: auto; }
  .trad em { font-style: normal; color: #7dd3a0; }
  .trad s { text-decoration: none; color: #6b7387; }
  /* Efteråt */
  .login { width: min(420px, 100%); background: var(--card); border: 1px solid var(--edge); border-radius: 20px; padding: 28px; display: grid; gap: 14px; box-sizing: border-box; }
  .login h1 { margin: 0; font-size: 26px; display: flex; align-items: center; gap: 12px; }
  .hand { width: 32px; height: 32px; }
  .band { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 14px; padding: 14px 16px; border-radius: 12px; background: #1b2a22; color: #d8ffe8; line-height: 1.5; }
  .band p { flex: 1 1 220px; margin: 0; }
  .band b { color: #fff; }
  .mejl { width: min(520px, 100%); background: #f6f4ef; color: #1d1d1f; border-radius: 12px; padding: 28px; display: grid; gap: 12px; font: 15px/1.55 system-ui, sans-serif; box-sizing: border-box; }
  .mejl .hd { color: #6b6b72; font-size: 12px; border-bottom: 1px solid #ddd8cc; padding-bottom: 10px; }
  .mejl h2 { margin: 0; font-size: 20px; }
  .mejl p { margin: 0; }
  .mejl .fot { color: #6b6b72; font-size: 12px; border-top: 1px solid #ddd8cc; padding-top: 10px; }
  .home { display: grid; gap: 16px; width: 640px; }
  .sida:not([data-bredd='dator']) .home { width: 100%; }
  .home header { display: flex; justify-content: space-between; align-items: baseline; }
  .home h1 { margin: 0; font-size: 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sida:not([data-bredd='dator']) .grid { grid-template-columns: 1fr 1fr; }
  .spel { background: var(--card); border: 1px solid var(--edge); border-radius: 16px; padding: 14px; display: grid; gap: 6px; color: #fff; }
  .spel i { display: block; height: 96px; aspect-ratio: 63 / 88; border-radius: 4px; background: var(--c); }
  .spel small { color: var(--muted); }

  /* ── Telefonen (player.css, join.css) ─────────────────────────────────────────────────────── */
  .tel { --bg: #14161c; --surface: #1b1e27; --control: #242938; --ink: #eee; --strong: #fff; --muted: #9aa3b8; --quiet: #7d8597; --accent: #7dd3a0; --on-accent: #0b2a18; --warn: #ffd98a; --warn-bg: #2a2417; --danger: #ff9a9a; --rule: #262a35; --rule-soft: #1f2330; --line: #2c3242;
    position: relative; height: 100%; min-height: inherit; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; box-sizing: border-box; }
  .tel button { font: inherit; cursor: pointer; }
  .tel :focus-visible { outline: 3px solid #9cc6ff; outline-offset: 2px; }
  .spelvy { display: flex; flex-direction: column; height: 100%; }
  .spelvy > header { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px; min-height: 52px; box-sizing: border-box; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
  .vem { flex: 1 1 0; min-width: 0; display: grid; line-height: 1.2; }
  .vem > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vem strong { color: var(--strong); font-size: 15px; }
  .vem strong[data-maskad] { font-style: italic; color: var(--soft-ink, #c3cbdd); }
  .vem span { font-size: 12px; }
  .angra { min-width: 44px; min-height: 44px; border: 0; border-radius: 10px; background: var(--control); color: var(--strong); display: grid; place-items: center; opacity: .35; }
  .tur { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--muted); }
  .tur b { display: inline-flex; align-items: center; gap: 8px; color: var(--strong); }
  .tur b::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #3b82d6; }
  .paneler { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .panel { display: grid; gap: 14px; align-content: start; padding: 14px 16px 20px; }
  .paneltitel { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; }
  .panel ol { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .panel li { padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
  .panel li em { font-style: normal; color: var(--ink); }
  .panel li em[data-maskad] { font-style: italic; color: #c3cbdd; }
  .hjalprad { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; min-height: 44px; color: var(--muted); font-size: 14px; }
  .fragetecken { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 700 !important; }
  .merknapp { width: 100%; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; background: var(--control); color: var(--strong); font: 700 16px system-ui, sans-serif !important; text-align: left; }
  .merknapp .g { width: 18px; height: 18px; }
  .merknapp[data-tyst] { background: transparent; border: 1px solid var(--line); color: #c3cbdd; font-weight: 600 !important; }
  .merknapp:disabled { opacity: .5; cursor: default; }
  .flikrad { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); background: var(--bg); }
  .flikrad button { min-height: 56px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; display: grid; justify-items: center; align-content: center; gap: 4px; }
  .flikrad button[aria-selected='true'] { color: var(--strong); box-shadow: inset 0 3px 0 var(--accent); }
  .flikrad .tal { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--control); color: var(--strong); font-size: 11px; line-height: 18px; box-sizing: border-box; }
  .flikrad .tom { height: 18px; }
  .toast { flex: none; margin: 0; padding: 10px 16px; background: #1b2a22; color: #d8ffe8; font-size: 14px; line-height: 1.45; border-top: 1px solid #2b4a38; }
  /* Arket från nederkanten (Lämna-arkets form) */
  .ark-skym { position: absolute; inset: 0; z-index: 6; background: rgb(5 7 12 / 65%); display: flex; align-items: flex-end; }
  .ark { width: 100%; box-sizing: border-box; display: grid; gap: 10px; padding: 18px 16px 20px; border-radius: 18px 18px 0 0; background: var(--surface); border-top: 1px solid var(--line); max-height: 92%; overflow-y: auto; }
  .ark h2 { margin: 0 0 2px; font-size: 18px; color: var(--strong); }
  .ark p { margin: 0; line-height: 1.45; color: #c3cbdd; font-size: 14px; }
  .ark ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; color: #c3cbdd; line-height: 1.4; font-size: 14px; }
  .val-knapp { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--control); color: var(--strong); }
  .val-knapp b { font-size: 16px; }
  .val-knapp span { font-size: 13px; color: #c3cbdd; font-weight: 400; line-height: 1.4; }
  .val-knapp[data-ny] { border-color: #6f5a2c; }
  .tel .farlig { min-height: 48px; border-radius: 12px; font-size: 16px; }
  .tel .sek2 { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--strong); font-size: 16px; font-weight: 600; }
  .tel .sek2.fokus { box-shadow: 0 0 0 3px #9cc6ff; }
  /* Enkätens tack */
  .tack { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto 1fr; padding: 22px 20px; box-sizing: border-box; background: var(--bg); overflow-y: auto; }
  .tack-mitt { display: grid; place-items: center; align-content: center; text-align: center; gap: 8px; }
  .tack-mitt strong.stor { font-size: 24px; color: var(--strong); }
  .tack-mitt .muted { font-size: 14px; }
  .spara { display: inline-flex; align-items: center; min-height: 44px; color: #7dd3a0; font-weight: 700; }
  .tillit { margin: 0; font-size: 13px; color: var(--muted); }
  .tillit u { text-underline-offset: 3px; }
  .tyst-lank { min-height: 44px; border: 0; background: none; color: #c3cbdd; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; padding: 0 6px; }
  .tel .fraga { text-align: left; }
  .tel .fraga button { color: #eee; }
  .klar { display: grid; gap: 8px; justify-items: center; padding: 14px; border-radius: 14px; background: #1b2a22; color: #d8ffe8; line-height: 1.5; }
  .klar strong { color: #fff; font-size: 16px; }
  /* Anslutningssidan */
  .join { padding: 10px 20px 24px; display: grid; gap: 14px; align-content: start; }
  .join-topp { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .join-topp u { color: #c3cbdd; text-underline-offset: 3px; }
  .join h1 { margin: 0; font-size: 24px; color: var(--strong); }
  .join .rum { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  .filt { position: relative; height: 150px; margin: 18px 22px; border-radius: 18px; background: radial-gradient(ellipse at center, #2e6b45, #1d4a30); border: 10px solid #4a2f1f; }
  .pill { position: absolute; width: 76px; height: 46px; border-radius: 23px; display: grid; place-items: center; align-content: center; color: #0d0f14; font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center; }
  .pill b { font-size: 14px; }
  .pill[data-vald] { box-shadow: 0 0 0 3px #fff; }
  .join .falt span { color: var(--strong); }
  .join .falt input { min-height: 52px; border-radius: 12px; border: 1px solid #6f7a90; background: #1b1e27; font-size: 17px; color: #fff; padding: 0 14px; width: 100%; box-sizing: border-box; }
  .mening { margin: 0; color: #e6e6e6; font-size: 15px; line-height: 1.5; }
  .mening u { color: #c3cbdd; text-underline-offset: 3px; }
  .mening-dl { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 10px; font-size: 14px; line-height: 1.45; color: #e6e6e6; }
  .mening-dl dt { color: var(--muted); }
  .mening-dl dd { margin: 0; }
  .sitt { min-height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-size: 18px !important; font-weight: 800 !important; }
  .sitt2 { min-height: 52px; border: 1px solid #6f7a90; border-radius: 12px; background: transparent; color: var(--strong); font-weight: 700 !important; }
  /* Kvar-skärmen (C) */
  .lamnat { position: absolute; inset: 0; display: grid; align-content: center; gap: 12px; padding: 24px 20px; text-align: center; justify-items: center; }
  .lamnat h1 { margin: 0; font-size: 22px; color: var(--strong); }
  /* TV:ns platser */
  .tvfilt { position: relative; height: 240px; margin: 24px 60px; border-radius: 26px; background: radial-gradient(ellipse at center, #2e6b45, #1d4a30); border: 14px solid #4a2f1f; }
  .tvfilt .pill { width: auto; min-width: 76px; padding: 0 14px; }
  .pill i { font-style: italic; font-weight: 600; }
  /* Resultat (editorn) */
  .ed { --bg: #0f1117; --card: #171a23; --edge: #262a35; --muted: #9aa3b8; min-height: inherit; background: var(--bg); color: #e6e6e6; font: 14px system-ui, sans-serif; padding: 24px 32px; box-sizing: border-box; display: grid; gap: 16px; align-content: start; }
  .ed h1 { margin: 0; font-size: 22px; }
  .ed .kort { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; }
  .ed h2 { margin: 0; font-size: 16px; }
  .ed h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .ed ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .ed li { line-height: 1.45; }

  const gastVag = {
    A: L('under tacket när bordet har avslutats', 'under the thanks once the table has ended'),
    B: L('under Mer, när som helst medan telefonen har bordets länk', 'under More, at any time while the phone has the table’s link'),
    C: L('när du lämnar bordet, eller under tacket när det har avslutats', 'when you leave the table, or under the thanks once it has ended'),
  }[v]
  return `<div class="villkor">
    <div class="fl"><span>${L('Villkor', 'Terms')}</span><span data-pa>${L('Integritet', 'Privacy')}</span></div>
    <h1>${L('Integritet i Decksters beta', 'Privacy in the Deckster beta')}</h1>
    <section class="avsnitt"><span>3</span><h2>${L('Om du är gäst vid ett bord', 'If you are a guest at a table')}</h2><div>
      <p class="ks">${L('Namnet du skriver, dina drag, anteckningar, flaggor och enkätsvar. Alla vid bordet ser dem medan ni spelar, och spelets ägare efteråt.', 'The name you write, your moves, notes, flags and survey answers. Everyone at the table sees them while you play, and the game’s owner afterwards.')} <ins>${L('Namnet och det du skriver tas bort efter ett år, eller när du ber om det.', 'Your name and what you write are removed after a year, or when you ask.')}</ins></p></div></section>
    <section class="avsnitt"><span>4</span><h2>${L('Hur länge vi sparar', 'How long we keep it')}</h2><div>
      <ul><li><ins><b>${L('Ett raderat konto:', 'A deleted account:')}</b> ${L('försvinner direkt. Bilder och typsnitt som bara dess spel använde tas bort inom 30 dagar.', 'is gone at once. Images and fonts only its games used are removed within 30 days.')}</ins></li></ul>
      <p><del>${L('Vill du att något raderas tidigare, ditt konto eller det du lämnat som gäst, skriver du till {contact}. Den här texten ändras när det finns fler vägar.', 'If you want something erased sooner, write to {contact}. This text changes when there are more ways.')}</del></p>
      <p><ins>${L(`Vill du att något raderas tidigare gör du det själv: kontot i Profil, och som gäst på telefonen ${gastVag}. Har telefonen inte länken kvar, skriv till {contact}.`, `If you want something erased sooner, you do it yourself: your account in Profile, and as a guest on your phone ${gastVag}. If the phone no longer has the link, write to {contact}.`)}</ins></p></div></section>
    <section class="avsnitt"><span>7</span><h2>${L('Dina rättigheter', 'Your rights')}</h2><div>
      <p><b>${L('Med konto:', 'With an account:')}</b> <del>${L('skriv till {contact}.', 'write to {contact}.')}</del> <ins>${L('i Profil laddar du ner det vi har om dig och raderar kontot.', 'in Profile you download what we have about you and delete your account.')}</ins> ${L('Ditt namn kan du själv ändra eller ta bort i Profil.', 'You can change or remove your name in Profile.')}</p>
      <p><b>${L('Som gäst:', 'As a guest:')}</b> <ins>${L(`ta bort ditt namn och dina svar på telefonen, ${gastVag}. Annars`, `remove your name and answers on your phone, ${gastVag}. Otherwise`)}</ins> ${L('skriv till {contact} med spelets namn, ungefär när ni spelade och namnet du satt under.', 'write to {contact} with the game’s name, roughly when you played and the name you sat under.')}</p></div></section>
  </div>`
}

// ── Ritningen ───────────────────────────────────────────────────────────────────────────────────
const scen = document.getElementById('scen')
const ram = (etikett, html, b = bredd, fast = false) => `<div class="ram"><p class="etikett">${etikett}</p><div class="sida" data-bredd="${b}" ${fast ? 'data-fast' : ''}>${html}</div></div>`
function render() {
  const gast = iss === 'gast'
  const ytor = YTOR[iss]
  if (!ytor[yta]) yta = Object.keys(ytor)[0]
  const breddVal = gast ? (yta === 'resultat' ? [['dator', 'Dator']] : [['375', '375'], ['320', '320']]) : [['dator', 'Dator'], ['375', '375'], ['320', '320']]
  if (!breddVal.some(([k]) => k === bredd)) bredd = breddVal[0][0]
  document.getElementById('iss').innerHTML = [['konto', 'Kontot #1280'], ['gast', 'Gästen #1281']].map(([k, n]) => `<button aria-pressed="${k === iss}" data-iss="${k}">${n}</button>`).join('')
  document.getElementById('vaxlare').innerHTML = Object.keys(V[iss]).map((k) => `<button aria-pressed="${k === v}" data-v="${k}">${k}</button>`).join('')
  document.getElementById('ytor').innerHTML = Object.entries(ytor).map(([k, n]) => `<button aria-pressed="${k === yta}" data-yta="${k}">${n}</button>`).join('')
  document.getElementById('bredd').innerHTML = breddVal.map(([k, n]) => `<button aria-pressed="${k === bredd}" data-bredd="${k}">${n}</button>`).join('')
  document.getElementById('lang').innerHTML = [['sv', 'Svenska'], ['en', 'English']].map(([k, n]) => `<button aria-pressed="${k === lang}" data-lang="${k}">${n}</button>`).join('')
  document.getElementById('ord').innerHTML = Object.keys(ORDEN).map((k) => `<button aria-pressed="${k === ord}" data-ord="${k}">${ORDEN[k][0]}</button>`).join('')
  document.getElementById('fas').innerHTML = [['spel', 'Mer-fliken, under spel'], ['tack', 'Tacket, efter enkäten']].map(([k, n]) => `<button aria-pressed="${k === fas}" data-fas="${k}">${n}</button>`).join('')
  document.getElementById('spraakgrupp').hidden = !gast
  document.getElementById('ordgrupp').hidden = !gast || !['telefon', 'andra', 'resultat'].includes(yta)
  document.getElementById('fasgrupp').hidden = !gast || yta !== 'telefon'
  document.getElementById('breddgrupp').hidden = breddVal.length < 2 || (!gast && yta === 'efter' && false)
  document.getElementById('anteckning').innerHTML = `<b>${V[iss][v].namn}.</b> ${V[iss][v].not}`
  let html = ''
  if (!gast) {
    if (yta === 'profil') html = ram(`<b>Profil</b> · variant ${v} · ${bredd === 'dator' ? '1040 px' : bredd + ' px'}`, profil())
    if (yta === 'utdrag') html = ram(`<b>Utdraget</b> · variant ${v}`, utdrag())
    if (yta === 'efter') html = efter().map(([e, h]) => ram(`<b>${e}</b> · variant ${v}`, h)).join('')
  } else {
    const lbl = `${ytor[yta]}</b> · variant ${v} · ${bredd === 'dator' ? '1040 px' : bredd + ' px'} · ${lang}`
    if (yta === 'join') html = ram(`<b>${lbl}`, join())
    if (yta === 'telefon') html = ram(`<b>${lbl}`, telefon(), bredd, true)
    if (yta === 'andra') html = andra().map(([e, h, b, f]) => ram(`<b>${e}</b> · variant ${v} · ${lang}`, h, b, f)).join('')
    if (yta === 'resultat') html = ram(`<b>${lbl} · ${L('designerns', 'the designer’s')}`, resultat(), 'dator')
    if (yta === 'integritet') html = ram(`<b>${lbl} · ${L('ändringarna markerade', 'changes marked')}`, integritet())
  }
  scen.innerHTML = html
  history.replaceState(null, '', `?iss=${iss}&v=${v}&yta=${yta}&bredd=${bredd}${gast ? `&lang=${lang}&ord=${ord}&fas=${fas}` : ''}`)
}

document.querySelector('.protorad').addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  if (b.dataset.iss) { iss = b.dataset.iss; v = iss === 'konto' ? 'A' : 'C'; ord = ORD_DEFAULT[v]; yta = Object.keys(YTOR[iss])[0]; bredd = iss === 'konto' ? 'dator' : '375'; omstart() }
  if (b.dataset.v) { v = b.dataset.v; ord = ORD_DEFAULT[v]; omstart() }
  if (b.dataset.yta) { yta = b.dataset.yta; omstart() }
  if (b.dataset.bredd) bredd = b.dataset.bredd
  if (b.dataset.lang) lang = b.dataset.lang
  if (b.dataset.ord) ord = b.dataset.ord
  if (b.dataset.fas) { fas = b.dataset.fas; omstart() }
  if (b.id === 'omstart') omstart()
  render()
})
scen.addEventListener('input', (e) => {
  if (e.target.matches('[data-typ]')) { st.typ = e.target.value; const pos = e.target.selectionStart; render(); const i = scen.querySelector('[data-typ]'); i.focus(); i.setSelectionRange(pos, pos) }
})
scen.addEventListener('change', (e) => {
  if (e.target.dataset.skog) { st.b.skog = e.target.dataset.skog; render() }
})
scen.addEventListener('click', (e) => {
  const b = e.target.closest('[data-do]')
  if (!b) return
  const d = b.dataset.do
  // Kontot
  if (d === 'dl') st.dl = 'hamtad'
  if (d === 'dl-stor') st.dl = 'hamtar'
  if (d === 'dl-klar') st.dl = 'hamtad'
  if (d === 'fraga') st.k = 'fraga'
  if (d === 'avbryt') st.k = 'vila'
  if (d === 'sida') st.k = 'sida'
  if (d === 'avbryt-sida') st.k = 'vila'
  if (d === 'fyll') st.typ = EPOST
  if (d === 'dialog') st.k = 'dialog'
  if (d === 'mejla') st.k = 'mejlat'
  if (d === 'lank') st.k = 'lank'
  if (d === 'radera') st.k = 'raderat'
  // Gästen
  if (d === 'g-fraga') st.g = 'fraga'
  if (d === 'g-avbryt') st.g = 'vila'
  if (d === 'g-ark') { st.ark = 'radera'; st.lamna = false }
  if (d === 'g-lamna') st.ark = 'lamna'
  if (d === 'g-ark-lamna') { st.ark = 'radera'; st.lamna = true }
  if (d === 'g-stang') { st.ark = null; st.lamna = false }
  if (d === 'g-radera') { st.g = 'klar'; st.ark = null }
  render()
})
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  const ks = Object.keys(V[iss])
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    v = ks[(ks.indexOf(v) + (e.key === 'ArrowRight' ? 1 : ks.length - 1)) % ks.length]
    ord = ORD_DEFAULT[v]; omstart(); render()
  }
})
render()
</script>
</body>
</html>
