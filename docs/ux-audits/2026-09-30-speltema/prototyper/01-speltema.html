  /* Ett prov står alltid mot kortets papper (L34). */

  /* ── Ytan ────────────────────────────────────────────────────────────────── */
  .yta { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--s5) var(--gutter) 120px; }

  .sektion > header small { color: var(--quiet); }

  /* Typsnitt */
  .slot { display: grid; grid-template-columns: 90px minmax(0,1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) 0; border-top: 1px solid var(--line-soft); }
  .slot:first-of-type { border-top: 0; }
  .slot .etikett { color: var(--quiet-2); }
  .slot .prov { font-size: 20px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .betydelser { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .betydelser li { display: grid; grid-template-columns: 34px 110px minmax(0,1fr) auto; gap: var(--s3); align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft); }

  .kontrast { color: var(--quiet); font-variant-numeric: tabular-nums; font-size: 11px; white-space: nowrap; }

  .ikoner small { color: var(--quiet); font-size: 10px; }
  .ikoner .ny { border-style: dashed; color: var(--quiet-2); align-content: center; }

  /* Biblioteket, två klick bort: ett ark ovanpå ytan. */
  .ark { position: fixed; inset: 64px 0 0 auto; width: min(480px, 100vw); background: #12141a; border-left: 1px solid #3a4050; box-shadow: -18px 0 44px rgba(0,0,0,.5); z-index: 30; display: flex; flex-direction: column; }

  /* ── Variant A: stilark med kortet bredvid ───────────────────────────────── */
  .A-rum { display: grid; grid-template-columns: minmax(0, 760px) 320px; gap: var(--s5); align-items: start; }

  .skrivs { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: var(--s3); background: var(--panel); }

  /* ── Variant B: kortet är kartan ────────────────────────────────────────── */

  .B-mitt { display: grid; grid-template-rows: auto 1fr auto; gap: var(--s4); justify-items: center; min-height: 0; }

  .B-kort { display: flex; gap: var(--s5); align-items: center; }

  .granskare { border-left: 1px solid var(--line); padding-left: var(--s5); overflow: auto; }

  /* ── Variant C: tema som ett val ─────────────────────────────────────────── */
  .galleri { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); max-width: 1100px; }
  .galleri button { display: grid; gap: var(--s2); justify-items: center; padding: var(--s4) var(--s3); border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: #e6ecfa; font: inherit; cursor: pointer; }

  .avvik { margin: var(--s5) 0 var(--s3); display: flex; align-items: center; gap: var(--s3); color: var(--quiet-2); max-width: 1100px; }

  details.fall { max-width: 1100px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: var(--s2); }

  .W { max-width: 1060px; margin: 0 auto; }

  .W-rum .sido { display: grid; justify-items: center; gap: var(--s3); position: sticky; top: 0; }

  .vaxlare { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #ffd98a; color: #1f1b12; box-shadow: 0 10px 30px rgba(0,0,0,.6); font-weight: 700; }

</style>

  retro: { namn: 'Retro', om: 'Smal versal rubrik, kondenserad text, gulnat papper', rubrik: 'Oswald', brod: 'Roboto Condensed', papper: '#fbf1d6', blak: '#2a1c10',
    betydelser: [['kostnad','Kostnad','#a8410c'],['vinst','Vinst','#7a5c00'],['forsvar','Försvar','#155e75'],['anfall','Anfall','#6b2d5c']] },
  bok: { namn: 'Krönika', om: 'Bokserif, varm läsbarhet, dämpade färger', rubrik: 'Lora', brod: 'Merriweather', papper: '#f7f2ea', blak: '#2a2320',
    betydelser: [['kostnad','Kostnad','#6b2d5c'],['vinst','Vinst','#2f6136'],['forsvar','Försvar','#3b3a86'],['anfall','Anfall','#8f2d20']] },
}
const klona = (t) => JSON.parse(JSON.stringify(t))
let tema = klona(TEMAN.skog), temaFran = 'skog'
let ikonset = ['mynt','skold','blad','kort','droppe','svard','flamma']

// ── Leken ─────────────────────────────────────────────────────────────────────────────────────
let RADER = [
  ['Gläntans väktare', 2, 'Betala {mynt|kostnad}{mynt|kostnad}: få {skold|forsvar}.'],
  ['Bergets vandrare', 1, 'Dra ett {kort}. Få {blad|vinst}.'],
  ['Flodens härold', 3, 'Betala {droppe|kostnad}: {svard|anfall} mot en varelse.'],
  ['Eldens barn', 2, '{flamma|anfall} Gör 2 skada. Få {mynt|vinst}.'],
  ['Tornets vakt', 4, 'Få {skold|forsvar}{skold|forsvar}. Blanda din hög.'],
]

// ── Hjälpare ──────────────────────────────────────────────────────────────────────────────────
const farg = (roll) => (tema.betydelser.find((b) => b[0] === roll) || [0, 0, tema.blak])[2]
const sym = (namn, f) => '<span class="sym" aria-hidden="true"><svg viewBox="0 0 16 16" fill="' + f + '">' + (GLYF[namn] || GLYF.tarning) + '</svg></span>'
const prov = (namn, f) => '<span class="papper" style="background:' + tema.papper + '">' + sym(namn, f || tema.blak) + '</span>'
const TRAFF = /\{([\p{L}\p{N}_-]+)(?:\|([\p{L}\p{N}_-]+))?\}/gu
const rendera = (s, klick) => s.replace(TRAFF, (h, n, r) => {
  const s2 = sym(n, r ? farg(r) : tema.blak)
  return klick && r ? '<span data-klick="betydelse:' + r + '">' + s2 + '</span>' : s2
})
const renderaTabell = (s) => s.replace(TRAFF, (h, n, r) => prov(n, r ? farg(r) : tema.blak))

function lum(hex) {
  const c = [1,3,5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]
}
const kvot = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05) }

function anvandning() {
  const n = {}, par = {}
  for (const [, , t] of RADER) for (const m of t.matchAll(TRAFF)) {
    n[m[1]] = (n[m[1]] || 0) + 1
    const k = m[1] + '|' + (m[2] || '')
    par[k] = (par[k] || 0) + 1
  }
  return { n, par }
}

function kort(rad, klass = '', klick = false) {
  const [namn, kostnad, text] = rad
  const k = klick ? (x) => ' data-klick="' + x + '"' : () => ''
  return '<div class="kort ' + klass + '"' + k('papper') + ' style="background:' + tema.papper + ';color:' + tema.blak + '">'
    + '<div class="topp"><span class="titel"' + k('rubrik') + ' style="font-family:\'' + tema.rubrik + '\'">' + namn + '</span>'
    + '<span class="kostnad">' + Array.from({ length: kostnad }, () => sym('mynt', farg('kostnad'))).join('') + '</span></div>'
    + '<div class="bild"></div>'
    + '<div class="text"' + k('brod') + ' style="font-family:\'' + tema.brod + '\'">' + rendera(text, klick) + '</div></div>'
}

// ── Temats delar, som varianterna ställer upp olika ──────────────────────────────────────────
function delTypsnitt() {
  const slot = (id, etikett) => '<div class="slot"><span class="etikett">' + etikett + '</span>'
    + '<span class="prov" style="font-family:\'' + tema[id] + '\'">' + (id === 'rubrik' ? 'Gläntans väktare' : 'Betala två mynt: få en sköld.') + '</span>'
    + '<select data-font="' + id + '" aria-label="' + etikett + '">' + TYPSNITT.map((f) => '<option' + (f === tema[id] ? ' selected' : '') + '>' + f + '</option>').join('') + '<option>Hela katalogen…</option></select></div>'
  return slot('rubrik', 'Rubrik') + slot('brod', 'Brödtext')
}
function delPapper() {
  return '<div class="slot"><span class="etikett">Papper</span><span class="prov" style="font-size:13px;color:var(--quiet-2)">Korten ritas på det här. Betydelsernas kontrast mäts mot det.</span>'
    + '<div class="black">' + ['#f4efe4','#ffffff','#fbf1d6','#f7f2ea','#e9efe6'].map((p) => '<button type="button" data-papper="' + p + '" aria-pressed="' + (p === tema.papper) + '" style="background:' + p + '" aria-label="Papper ' + p + '"></button>').join('') + '</div></div>'
}
function delBetydelser(fokus) {
  const { n } = anvandning()
  return '<ul class="betydelser">' + tema.betydelser.map(([id, namn, f]) => {
    const k = kvot(f, tema.papper)
    const kort = RADER.filter((r) => r[2].includes('|' + id + '}')).length
    return '<li' + (fokus === id ? ' style="background:#1b2437;border-radius:8px"' : '') + '>' + prov('mynt', f) + '<span><b>' + namn + '</b><br><small class="kontrast">' + kort + ' kort</small></span>'
      + '<div class="black">' + INKS.map(([inamn, hex]) => '<button type="button" data-ink="' + id + ':' + hex + '" aria-pressed="' + (hex === f) + '" style="background:' + hex + '" aria-label="Måla ' + namn + ' i ' + inamn + '"></button>').join('') + '</div>'
      + '<span class="kontrast' + (k < 3 ? ' lag' : '') + '">' + k.toFixed(1) + ':1</span></li>'
  }).join('') + '</ul>'
}
function delIkoner() {
  const { n } = anvandning()
  return '<div class="ikoner">' + ikonset.map((i) => '<button type="button" data-ikon="' + i + '">' + prov(i) + NAMN[i] + '<small>' + (n[i] || 0) + ' kort</small></button>').join('')
    + '<button type="button" class="ny" data-bibliotek>＋ Ur biblioteket</button></div>'
}
function skrivs() {
  return '<div class="skrivs"><div style="color:var(--quiet-2)">Så skrivs det i Tabell</div>'
    + '<div>' + prov('mynt') + ' utan betydelse <code>{mynt}</code></div>'
    + tema.betydelser.map(([id, namn, f]) => '<div>' + prov('mynt', f) + ' ' + namn + ' <code>{mynt|' + id + '}</code></div>').join('') + '</div>'
}

  let lista = ''
  if (klammer.lage === 'tema') {

    lista = (sokt ? '' : '<h4>Som leken skriver dem <span class="klick">ett klick</span></h4><div class="vanliga">' + vanliga.map(([k, c]) => {

  return '<div class="T-rum"><div class="tabell"><table><thead><tr><th style="width:26%">Namn</th><th style="width:10%">Kostnad</th><th>Text</th></tr></thead><tbody>'
    + RADER.map((r, i) => i === 2

function ritaArk() {
  document.getElementById('ark').innerHTML = '<header><h3>Symbolbibliotek</h3><button type="button" class="knapp" data-stangark>Klar</button></header><div class="inne">'
    + '<input class="sok" style="width:100%;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#0f1115;color:#fff;font:inherit;padding:0 10px" placeholder="Sök symbol…" aria-label="Sök symbol">'
    + KATEGORIER.map(([k, is]) => '<h4>' + k + '</h4><div class="ikoner">' + is.map((i) => '<button type="button" data-tain="' + i + '" aria-pressed="' + ikonset.includes(i) + '">' + prov(i) + NAMN[i] + '<small>' + (ikonset.includes(i) ? 'i temat' : 'ta in') + '</small></button>').join('') + '</div>').join('')
    + '<p class="licens">Ritat för projektet, CC0. Licensen följer med i trycket.</p></div>'
}

// ── Växlaren och ritningen ───────────────────────────────────────────────────────────────────
const VYER = { tema: TEMA_VARIANTER, tabell: TABELL_VARIANTER, wizard: WIZARD_VARIANTER }
const q = new URLSearchParams(location.search)
let vy = VYER[q.get('vy')] ? q.get('vy') : 'tema'
let variant = VYER[vy][q.get('variant')] ? q.get('variant') : 'A'

function rita() {
  const v = VYER[vy][variant]
  const aktiv = vy === 'wizard' ? null : vy === 'tema' ? 'Speltema' : 'Tabell'
  document.getElementById('flikar').innerHTML = vy === 'wizard' ? '<button type="button" aria-selected="true">Ny lek · guidad start</button>'
    : ['Kortvägg','Mall','Tabell','Speltema','Media','Regler','Bord'].map((f) => '<button type="button"' + (f === aktiv ? ' aria-selected="true"' : '') + '>' + f + '</button>').join('')
  document.getElementById('beskrivning').textContent = v.om
  document.getElementById('variantnamn').textContent = v.namn + '  (' + (Object.keys(VYER[vy]).indexOf(variant) + 1) + '/' + Object.keys(VYER[vy]).length + ')'
  document.querySelectorAll('.vaxlare .vy').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vy === vy)))
  const oppna = [...document.querySelectorAll('details.fall')].map((d) => d.open)
  document.getElementById('yta').innerHTML = v.rita()
  document.querySelectorAll('details.fall').forEach((d, i) => { d.open = !!oppna[i] })
  if (!document.getElementById('ark').hidden) ritaArk()
  const s = document.getElementById('ksok')
  if (s && klammer.fokus) { s.focus(); s.setSelectionRange(s.value.length, s.value.length) }
}
function byt(steg) {
  const ks = Object.keys(VYER[vy])
  variant = ks[(ks.indexOf(variant) + steg + ks.length) % ks.length]
  history.replaceState(null, '', '?vy=' + vy + '&variant=' + variant)
  rita()
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-klick], summary')
  if (!t) return
  const d = t.dataset
  if (t.id === 'bak') return byt(-1)
  if (t.id === 'fram') return byt(1)
  if (d.vy) { vy = d.vy; variant = 'A'; history.replaceState(null, '', '?vy=' + vy + '&variant=A'); return rita() }
  if (d.ink) { const [id, hex] = d.ink.split(':'); tema.betydelser.find((b) => b[0] === id)[2] = hex; return rita() }
  if (d.papper) { tema.papper = d.papper; return rita() }
  if (d.tema) { temaFran = d.tema; tema = klona(TEMAN[d.tema]); return rita() }
  if (d.ram) { ram = d.ram; return rita() }
  if (d.b) { bVal = d.b; return rita() }
  if (d.klick) { bVal = d.klick; return rita() }
  if (d.fontval) { const [slot, f] = d.fontval.split(':'); tema[slot] = f; return rita() }
  if ('bibliotek' in d) { document.getElementById('ark').hidden = false; ritaArk(); return }
  if ('stangark' in d) { document.getElementById('ark').hidden = true; return }
  if (d.tain) { const i = d.tain; ikonset = ikonset.includes(i) ? ikonset.filter((x) => x !== i) : [...ikonset, i]; return rita() }
  if (d.klage) { klammer.lage = d.klage; klammer.vald = null; klammer.roll = null; return rita() }
  if (d.kvalj) { klammer.vald = d.kvalj; klammer.roll = null; return rita() }
  if ('kroll' in d) { klammer.roll = d.kroll || null; return rita() }
  if (d.infoga) {
    const [n, r] = d.infoga.split('|')
    cellText += '{' + n + (r ? '|' + r : '') + '} '
    if (!ikonset.includes(n)) ikonset.push(n)
    klammer = { oppen: false, lage: 'tema', vald: null, roll: null, sok: '' }
    return rita()
  }
  if ('kopna' in d) { klammer.oppen = true; return rita() }
})
document.addEventListener('change', (e) => {
  const f = e.target.dataset.font
  if (f && e.target.value !== 'Hela katalogen…') { tema[f] = e.target.value; rita() }
})
document.addEventListener('input', (e) => {
  if (e.target.id === 'ksok') { klammer.sok = e.target.value; klammer.fokus = true; rita() }
})
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) { if (e.key === 'Escape' && e.target.id === 'ksok') { klammer.oppen = false; rita() } return }
  if (e.key === 'ArrowLeft') byt(-1)
  if (e.key === 'ArrowRight') byt(1)
  if (e.key === 'Escape') { document.getElementById('ark').hidden = true }
})
rita()
</script>
</body>
</html>
