<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 02 — rutan «Wizarden är startpunkten» (#687)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan (#687) ──────────────────────────────────────────────────────────────────────
     Överst i guidad start står en gul ruta med bara etiketten «WIZARDEN ÄR STARTPUNKTEN»:
     brödtexten flyttade bakom «?» (L36) men lådan blev kvar. Vad ska den bli? Och #691
     (beslutat 2026-10-06) vill att en utloggad /new tidigt säger att spelet sparas på ett konto.

     Bilderna är det byggda appen (packages/e2e-stacken, /new) med rutans form injicerad
     (matning/page.js). Inloggad och utloggad är riktiga sessioner.
     ──────────────────────────────────────────────────────────────────────────────────────── */
  body { overflow: auto; }
  .krona { display: grid; gap: 8px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .krona h1 { margin: 0; color: #fff; font-size: 15px; }
  .rad { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rad > span { color: var(--quiet-2); font-size: 12px; min-width: 64px; }
  .rad button { min-height: 36px; padding: 0 10px; border: 1px solid #3b414e; border-radius: 8px; background: #1b1d23; color: #dce3f2; font: inherit; cursor: pointer; }
  .rad button[aria-pressed='true'] { background: #24507f; border-color: var(--primary-mark); color: #fff; }
  .rad button.rek { border-color: #3f7a55; }
  .rad button:focus-visible { outline: 2px solid var(--primary-mark); outline-offset: 2px; }
  .scen { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; background: #15171c; }
  @media (max-width: 1000px) { .scen { grid-template-columns: minmax(0, 1fr); } }
  .bild img { display: block; max-width: 100%; height: auto; border: 1px solid #2f333d; border-radius: 6px; margin-bottom: 12px; }
  .bild p { color: var(--quiet-2); font-size: 12px; margin: -6px 0 12px; }
  .ruta { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .ruta h2 { margin: 0 0 6px; color: #fff; font-size: 14px; }
  .ruta p { margin: 0 0 6px; line-height: 1.5; color: #c9d1e3; }
  .tal { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; }
  .tal b { text-align: right; }
  .forkl { color: var(--quiet-2); font-size: 12px; margin: 6px 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="krona">
  <h1>Prototyp 02 — rutan överst i guidad start (#687) <small style="color:var(--quiet-2);font-weight:400">· ← → byter form</small></h1>
  <div class="rad" id="former"><span>Rutan</span></div>
  <div class="rad" id="ytor"><span>Yta</span></div>
</div>
<div class="scen">
  <div class="bild" id="bilder"></div>
  <div>
    <div class="ruta"><h2 id="fnamn"></h2><p id="fregel"></p><p id="fpris" class="forkl"></p></div>
    <div class="ruta"><h2>Mätt</h2><div class="tal" id="tal"></div></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const FORMER = [
  { id: 'nu', namn: 'Nu', regel: 'En gul ruta, 445 × 52 vid 1280, med bara den versala etiketten «Wizarden är startpunkten». Brödtexten står bakom stegets «?» sedan L36.', pris: 'Läses som en banner som tappat sin text, och ytan får två namn på en skärm — «Guidad start» i ögonbrynet och «wizarden» här. «Wizard» är inte ett svenskt ord.' },
  { id: 'bort', namn: 'Borta', regel: 'Rutan tas bort. Hjälpen bakom «?» vid Spelet bär redan texten («Guidad start: skapa några exempelkort här …»), och ögonbrynet säger «Guidad start».', pris: 'Steg 1 flyttar upp 77 px, och ytan har ett namn. Inget sägs om konto — det #691 vill ha för den utloggade måste då stå någon annanstans.' },
  { id: 'mening', namn: 'En mening', regel: 'Rutan behåller sin plats men blir en tyst ruta med en mening utan etikett: «Här gör du spelets första kort. Mallen, hela leken och CSV väntar i editorn.»', pris: 'Ger tillbaka det L36 kortade bort — samma sak står redan bakom «?» bredvid, så den säger det två gånger. 64 px hög.' },
  { id: 'konto', namn: 'Kontoraden (#691), bara utloggad', rek: true, regel: 'Rutan blir platsen där en utloggad /new säger det #691 beslutade: «Spelet sparas på ett konto. Du loggar in med e-post när du skapar det, och det du skrivit här följer med.» Inloggad finns ingen ruta alls. Den gula grunden behålls: det är ett besked, inte hjälp.', pris: 'Varje ruta som står har något att säga, och den som är inloggad ser ingen. Texten är ett förslag — #691:s beslut säger bara att en utloggad /new ska säga det tidigt — och den ska stämmas av med den som bygger #691, så att meningen står på ett ställe.' },
]
const YTOR = [{ id: 1280, namn: '1280 × 800' }, { id: 1024, namn: '1024 × 768' }, { id: 768, namn: '768 × 1024 (steg)' }]
const M = window.MATT
const q = new URLSearchParams(location.search)
let f = q.get('v') ?? 'konto', yta = Number(q.get('yta') ?? 1280)
const knappar = (rot, lista, nu, val) => {
  rot.querySelectorAll('button').forEach((b) => b.remove())
  for (const x of lista) {
    const b = document.createElement('button')
    b.textContent = x.namn
    if (x.rek) b.classList.add('rek')
    b.setAttribute('aria-pressed', String(x.id === nu))
    b.onclick = () => val(x.id)
    rot.append(b)
  }
}
const visa = () => {
  history.replaceState(null, '', `?v=${f}&yta=${yta}`)
  knappar(document.querySelector('#former'), FORMER, f, (x) => { f = x; visa() })
  knappar(document.querySelector('#ytor'), YTOR, yta, (x) => { yta = x; visa() })
  const F = FORMER.find((x) => x.id === f)
  document.querySelector('#fnamn').textContent = F.namn + (F.rek ? ' — rekommendationen' : '')
  document.querySelector('#fregel').textContent = F.regel
  document.querySelector('#fpris').textContent = F.pris
  const rows = M.box.filter((r) => r.box === f && r.w === yta)
  document.querySelector('#bilder').innerHTML = rows.map((r) => `<img src="img/${r.file}" alt="${F.namn}, ${yta}, ${r.loggedIn ? 'inloggad' : 'utloggad'}"><p>${F.namn} · ${yta} · ${r.loggedIn ? 'inloggad' : 'utloggad'}</p>`).join('')
  const nu = M.box.find((r) => r.box === 'nu' && r.w === yta)
  document.querySelector('#tal').innerHTML = rows.map((r) => [[`${r.loggedIn ? 'Inloggad' : 'Utloggad'}: rutan`, r.size ? `${r.size[0]} × ${r.size[1]} px` : 'ingen'], [`${r.loggedIn ? 'Inloggad' : 'Utloggad'}: steg 1 börjar`, `${r.step1Top} px (nu ${nu.step1Top})`]]).flat().map(([k, n]) => `<span>${k}</span><b>${n}</b>`).join('')
}
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return
  const i = FORMER.findIndex((x) => x.id === f)
  f = FORMER[(i + (e.key === 'ArrowRight' ? 1 : FORMER.length - 1)) % FORMER.length].id
  visa()
})
visa()
</script>
</body>
</html>
