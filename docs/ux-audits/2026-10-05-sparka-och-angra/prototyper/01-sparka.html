<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 01 — Sparka och Ny kod (#679)</title>
<!-- PROTOTYP, slängkod. Frågan: hur ska Sparka (×) och «Ny kod» i bordsbandet bekräftas, och vad ska
     den sparkade telefonen erbjuda? Tre varianter, ?variant=A|B|C eller pilarna längst ned. -->
<link rel="stylesheet" href="proto.css">
<style>
  body { overflow: auto; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: var(--s5); padding: var(--s5); align-items: start; }
  .note { margin: 0 0 var(--s3); color: var(--quiet-2); max-width: 70ch; line-height: 1.5; }
  .note b { color: #fff; }
  /* Bordsbandet, som editorn ritar det (L60, L61). */
  .band { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); padding: 8px 16px; background: #13251b; color: #7dd3a0; border: 1px solid #2f333d; border-radius: 8px; min-height: 60px; }
  .band a { color: #fff; }
  .band .code { color: #fff; font-weight: 700; letter-spacing: 1px; }
  .band button.box { min-height: 44px; padding: 0 12px; border: 1px solid #5f7f69; border-radius: 8px; background: transparent; color: #e3f3e8; font: inherit; font-weight: 700; cursor: pointer; }
  .band button.box.danger { border-color: #e2725b; color: #ffd9cf; }
  .band button.box.fill { background: #7dd3a0; color: #0b2a18; border-color: #7dd3a0; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 44px; padding-left: 12px; border-radius: 999px; outline: 1px solid #5f7f69; outline-offset: -1px; color: #e3f3e8; font-weight: 700; white-space: nowrap; }
  .chip button { width: 44px; height: 44px; border: 0; border-radius: 0 999px 999px 0; background: transparent; color: #a9d8b8; font-size: 16px; cursor: pointer; }
  .chip button:hover { background: #2a3a2c; color: #fff; }
  .chip[data-going] { outline-color: #e2725b; color: #ffd9cf; }
  .chip[data-going] .t { font-weight: 400; color: #ffd9cf; margin-right: 4px; }
  .ask { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: 8px 0 2px; color: #fff; }
  .ask p { margin: 0; flex: 1 1 260px; }
  .ask p small { display: block; color: #a9d8b8; font-weight: 400; }
  .said { flex-basis: 100%; color: #e3f3e8; padding-top: 4px; }
  .said button { margin-left: 8px; }
  /* Telefonen, som den sparkade ser den. */
  .phone { width: 390px; height: 700px; border-radius: 28px; border: 1px solid #3b4358; background: #10141c; padding: 28px 22px; display: flex; flex-direction: column; gap: var(--s3); color: #e6ecfa; }
  .phone h1 { font-size: 20px; margin: 40px 0 0; }
  .phone p { margin: 0; color: #c3cbdd; line-height: 1.5; }
  .phone .btn { width: 100%; }
  .phone .btn.green { background: #7dd3a0; color: #0b2a18; border-color: #7dd3a0; }
  .phone .link { background: none; border: 0; color: #9cc6ff; text-decoration: underline; font: inherit; min-height: 44px; cursor: pointer; text-align: left; padding: 0; }
  .phone .spacer { flex: 1; }
  .cap { color: var(--quiet); font-size: 12px; margin: var(--s2) 0 0; }
  .vaxlare { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #ffd98a; color: #1f1b12; box-shadow: 0 10px 30px rgba(0,0,0,.6); font-weight: 700; }
  .vaxlare button { min-width: 36px; min-height: 36px; border: 0; border-radius: 999px; background: #1f1b12; color: #ffd98a; font: inherit; cursor: pointer; }
  .vaxlare .namn { padding: 0 12px; min-width: 300px; text-align: center; font-size: 12.5px; }
</style>
</head>
<body>
<div class="shell">
  <header><a class="home" href="#">‹ Mina spel</a><strong>Sal's Saloon</strong><span class="spacer"></span><span class="saved">Sparat</span></header>
  <div class="stage">
    <div>
      <p class="note" id="om"></p>
      <div class="band" id="band"></div>
      <p class="cap">Tryck × på en bricka, eller «Ny kod». «Återställ» lägger tillbaka alla platser.</p>
      <p><button class="btn quiet" id="reset" type="button">Återställ</button></p>
    </div>
    <div>
      <div class="phone" id="phone"></div>
      <p class="cap" id="phonecap"></p>
    </div>
  </div>
</div>
<div class="vaxlare" role="group" aria-label="Variant">
  <button type="button" id="prev" aria-label="Föregående variant">‹</button>
  <span class="namn" id="namn"></span>
  <button type="button" id="next" aria-label="Nästa variant">›</button>
</div>
<script>
const VARIANTER = {
  A: { namn: 'A — Frågan i bandet', om: '<b>Fråga först.</b> × och «Ny kod» byter bandets rad mot en fråga med vad det kostar, som «Avsluta bordet» redan gör. Inget sker förrän «Sparka» trycks. <b>+</b> Inget kan ske av misstag. <b>−</b> Ett tryck till varje gång, också när värden menade det.' },
  B: { namn: 'B — Ångra-stunden', om: '<b>Sker, men går att ta tillbaka.</b> × märker brickan «sparkas om 5 s · Ångra», och först när tiden gått släpps platsen. «Ny kod» byts direkt och kvitteras med den nya koden och en Ångra. <b>+</b> Ett tryck för den som menade det. <b>−</b> Telefonen hinner inte märka något under stunden, men handen ligger kvar i 5 s; en felträff måste ses för att ångras.' },
  C: { namn: 'C — Frågan, med koden i samma andetag', om: '<b>Fråga, och erbjud att stänga dörren.</b> Frågan om sparken har ett andra val, «Sparka och byt kod», så att sparken betyder något utan att värden själv måste komma på det. «Ny kod» frågar. <b>+</b> Rättar fyndets tredje del i bandet. <b>−</b> Två röda val i samma rad.' },
}
const KEYS = Object.keys(VARIANTER)
const q = new URLSearchParams(location.search)
let v = KEYS.includes(q.get('variant')) ? q.get('variant') : 'A'
const start = () => ({ seats: ['Ada', 'Bo', 'Cy'], code: 'UF6H2W', asking: null, going: {}, said: null, kicked: null, rotated: false })
let s = start()
const timers = {}
const CODES = ['SAFYX3', 'KM4QZ8', 'R7TPLA']

function newCode() { s.code = CODES[(CODES.indexOf(s.code) + 1) % CODES.length]; s.rotated = true }
function kick(name, rotate) {
  s.seats = s.seats.filter((n) => n !== name); s.kicked = name; s.asking = null
  if (rotate) newCode()
  s.said = rotate ? `${name} är borttagen, och rumskoden är nu ${s.code}. Den gamla gäller inte längre.` : `${name} är borttagen. Korten i ${name}s hand ligger i Kortlek.`
}
function press(kind, name) {
  if (v === 'A' || v === 'C') { s.asking = { kind, name }; draw(); return }
  if (kind === 'kick') {
    s.going[name] = 5
    timers[name] = setInterval(() => {
      s.going[name]--
      if (s.going[name] <= 0) { clearInterval(timers[name]); delete s.going[name]; kick(name, false) }
      draw()
    }, 1000)
  } else { const was = s.code; newCode(); s.said = `Ny rumskod ${s.code}. ${was} gäller inte längre.`; s.undoCode = was }
  draw()
}
function draw() {
  document.getElementById('namn').textContent = VARIANTER[v].namn
  document.getElementById('om').innerHTML = VARIANTER[v].om
  const band = document.getElementById('band')
  const chips = s.seats.map((n) => s.going[n] !== undefined
    ? `<li class="chip" data-going>${n} <span class="t">sparkas om ${s.going[n]} s</span><button type="button" data-undo="${n}" aria-label="Ångra sparken av ${n}">Ångra</button></li>`
    : `<li class="chip">${n}<button type="button" data-kick="${n}" aria-label="Sparka ${n}">×</button></li>`).join('')
  let ask = ''
  if (s.asking?.kind === 'kick') {
    const n = s.asking.name
    ask = `<div class="ask" role="alertdialog" aria-label="Sparka ${n}"><p>Sparka ${n}? <small>Korten i ${n}s hand går tillbaka i Kortlek, och telefonen lämnar bordet.</small></p>`
      + `<button class="box danger" data-yes="kick">Sparka ${n}</button>`
      + (v === 'C' ? `<button class="box danger" data-yes="kickrotate">Sparka och byt kod</button>` : '')
      + `<button class="box" data-no>Avbryt</button></div>`
  } else if (s.asking?.kind === 'code') {
    ask = `<div class="ask" role="alertdialog" aria-label="Byt rumskod"><p>Byt rumskod? <small>${s.code} på TV:n och i det du skickat slutar gälla. De som sitter sitter kvar.</small></p><button class="box danger" data-yes="code">Byt kod</button><button class="box" data-no>Avbryt</button></div>`
  }
  const said = s.said && !s.asking ? `<div class="said" role="status">${s.said}${v === 'B' && s.undoCode ? '<button class="box" data-undocode>Ångra</button>' : ''}</div>` : ''
  band.innerHTML = `Bordet kör rev-3 — <a href="#">öppna bordet</a> · rumskod <span class="code">${s.code}</span> <button class="box" data-code type="button">Ny kod</button> · vid bordet: <ul class="chips">${chips}</ul>${ask}${said}`
  drawPhone()
}
function drawPhone() {
  const p = document.getElementById('phone')
  const cap = document.getElementById('phonecap')
  if (!s.kicked) { p.innerHTML = '<h1>Bo</h1><p>Bos telefon vid bordet. Sparka Bo i bandet för att se vad den sparkade får.</p>'; cap.textContent = ''; return }
  const n = s.kicked
  const closed = s.rotated
  p.innerHTML = `<h1>Du är inte längre vid bordet</h1><p>Värden tog bort dig från Sal's Saloon. Korten du hade ligger tillbaka i leken.</p>`
    + `<span class="spacer"></span><button class="btn green">Till startsidan</button>`
    + (closed ? `<p style="font-size:12px">Bordet har fått en ny rumskod. Vill du tillbaka får du be värden om den.</p>` : `<button class="link">Välj plats igen</button>`)
  cap.textContent = closed ? `${n}s telefon efter sparken med ny kod: ingen väg tillbaka utan värden.` : `${n}s telefon: «Till startsidan» är den primära vägen; att sätta sig igen är kvar som länk, inte som grön knapp.`
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.kick) press('kick', b.dataset.kick)
  else if (b.dataset.code !== undefined) press('code')
  else if (b.dataset.undo) { clearInterval(timers[b.dataset.undo]); delete s.going[b.dataset.undo]; draw() }
  else if (b.dataset.undocode !== undefined) { s.code = s.undoCode; s.undoCode = null; s.said = `Rumskoden är ${s.code} igen.`; draw() }
  else if (b.dataset.no !== undefined) { s.asking = null; draw() }
  else if (b.dataset.yes === 'kick') kick(s.asking.name, false), draw()
  else if (b.dataset.yes === 'kickrotate') kick(s.asking.name, true), draw()
  else if (b.dataset.yes === 'code') { newCode(); s.asking = null; s.said = `Ny rumskod ${s.code}. Den gamla gäller inte längre.`; draw() }
  else if (b.id === 'reset') { Object.values(timers).forEach(clearInterval); s = start(); draw() }
})
function go(d) { const i = (KEYS.indexOf(v) + d + KEYS.length) % KEYS.length; v = KEYS[i]; q.set('variant', v); history.replaceState(null, '', '?' + q); Object.values(timers).forEach(clearInterval); s = start(); draw() }
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1) })
draw()
</script>
</body>
</html>
