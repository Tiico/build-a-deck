<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 21 — TV-spaltens text (#482 fynd 6)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan ──────────────────────────────────────────────────────────────────────────────
     TV-spaltens text är 12–14 px: rubrikerna PLATSER och SENAST 12 px, raderna i «Senast» 14 px,
     «4 kort på hand» 13 px, «Inget ännu» 12 px. På en 55-tums TV från soffan (ungefär 3 m) är en
     px på 1920 × 1080 ungefär 0,63 mm, och 14 px är en bokstav på 6 mm — i underkant för en
     löptext som ska läsas i förbifarten (K9, K18). Namnen på platserna är 17 px.

       Nu  som i dag
       A   ett steg upp överallt: rubriker 15, rader 18, «kort på hand» 16
       B   två nivåer: det som följer spelet stort (namn 24, antal 20, senaste rad 20), historiken
           mindre (16) och bara tre rader
       C   B, och spalten tar bort det som redan står på filten (koden och QR bara före start)

     Spalten ritas i verklig storlek för en 1920 × 1080-skärm, skalad till fönstret. Knappen
     «Långt håll» visar samma spalt i ungefär den vinkelstorlek den har från 3 m på en 55-tums TV
     sedd på en 24-tums skärm från 60 cm. ────────────────────────────────────────────────── */
  body { display: flex; flex-direction: column; height: 100vh; }
  .scen { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: 24px; padding: 16px; background: #0a0c10; overflow: auto; }
  .spalt { width: 360px; height: 1080px; box-sizing: border-box; padding: 30px 20px; background: #0c0e13; border: 1px solid #1a1e29; color: #dce3f2; font-family: system-ui, sans-serif; transform-origin: top center; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .spalt h1 { margin: 0; font-size: var(--titel); color: #fff; }
  .spalt .kod { display: flex; gap: 12px; align-items: center; }
  .spalt .kod b { font: 700 28px ui-monospace, monospace; letter-spacing: 6px; background: #151924; border-radius: 8px; padding: 6px 12px; }
  .spalt .qr { width: 52px; height: 52px; background: repeating-conic-gradient(#fff 0 25%, #000 0 50%) 0 0 / 8px 8px; }
  .spalt h2 { margin: 8px 0 0; font-size: var(--rubrik); letter-spacing: 2px; color: #7d8597; }
  .plats { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: #151924; border-radius: 12px; padding: 9px 12px; border-left: 6px solid var(--c); }
  .plats i { width: calc(var(--namn) * 2.2); height: calc(var(--namn) * 2.2); border-radius: 50%; background: var(--c); display: grid; place-items: center; font: 800 var(--namn) system-ui; font-style: normal; color: #10131a; }
  .plats b { display: block; font-size: var(--namn); }
  .plats span span { display: block; color: #c3cbdd; font-size: var(--antal); }
  .plats small { display: block; color: #8d95a8; font-size: var(--liten); }
  ol { list-style: none; margin: 0; padding: 0; }
  ol li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1a1e29; font-size: var(--rad); color: #c3cbdd; }
  ol li:first-child { font-size: var(--forsta); color: #fff; }
  ol li b { color: #4c5468; font: 400 0.8em ui-monospace, monospace; min-width: 2em; }
  .langt .spalt { transform: scale(0.42); }
</style>
</head>
<body>
<div class="protorad">
  <div class="vaxlare" role="group" aria-label="Variant">
    <button type="button" data-v="nu">Nu</button>
    <button type="button" data-v="a">A</button>
    <button type="button" data-v="b">B</button>
    <button type="button" data-v="c">C</button>
  </div>
  <div class="fraga">
    <p><b>#482 fynd 6 · TV-spaltens text från soffan.</b> Jämför varianterna i verklig storlek, och med «Långt håll».</p>
  </div>
  <button type="button" id="langt" aria-pressed="false">Långt håll</button>
  <p class="anteckning" id="anteckning"></p>
</div>
<div class="scen" id="scen"></div>
<script>
const s = { v: 'b', langt: false }
const STORLEK = {
  nu: { titel: '22px', rubrik: '12px', namn: '17px', antal: '13px', liten: '12px', rad: '14px', forsta: '14px', rader: 9 },
  a: { titel: '24px', rubrik: '15px', namn: '20px', antal: '16px', liten: '15px', rad: '18px', forsta: '18px', rader: 6 },
  b: { titel: '24px', rubrik: '15px', namn: '24px', antal: '20px', liten: '16px', rad: '16px', forsta: '20px', rader: 3 },
  c: { titel: '24px', rubrik: '15px', namn: '24px', antal: '20px', liten: '16px', rad: '16px', forsta: '20px', rader: 4, utanKod: true },
}
const NOT = {
  nu: '<b>Nu.</b> 12–14 px. <span class="minus">− Rubrikerna och «Senast» är svåra att läsa från soffan.</span>',
  a: '<b>A · Ett steg upp.</b> Allt ungefär en fjärdedel större, samma ordning. <span class="plus">+ Enkel regel, samma spalt.</span> <span class="minus">− «Senast» får plats med färre rader.</span>',
  b: '<b>B · Två nivåer.</b> Det som följer spelet — namn, antal, den senaste raden — stort; historiken mindre och bara tre rader. <span class="plus">+ Det man tittar upp för läses i förbifarten.</span> <span class="minus">− Historiken är kortare på TV:n (hela står på telefonerna).</span>',
  c: '<b>C · Två nivåer, och koden bara före start.</b> Som B, men rumskoden och QR står bara tills spelet startat. <span class="plus">+ Mer plats åt platserna och raderna under spelet.</span> <span class="minus">− Den som kommer sent får koden från någons telefon eller editorn.</span>',
}
const PLATSER = [['A', 'Ada', 4, '#e05d5d'], ['B', 'Bo', 3, '#3c8ce7'], ['C', 'Cilla', 1, '#3fb27f'], ['D', 'Dan', 0, '#e0a93b']]
const RADER = ['Bordet blandade Kortlek', 'Ada spelade Revolverman till Framför A', 'Bo drog 1 kort från Kortlek', 'Bordet vände ett kort', 'Cilla lade Sheriff på Kasthög', 'Bordet delade ut 1 från Kortlek till en ny hög', 'Ada drog 2 kort', 'Dan satte sig vid D', 'Bo lade Bandit i Framför B']
function rita() {
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === s.v))
  document.getElementById('langt').setAttribute('aria-pressed', String(s.langt))
  document.getElementById('anteckning').innerHTML = NOT[s.v]
  const z = STORLEK[s.v]
  const vars = Object.entries(z).filter(([k]) => typeof z[k] === 'string').map(([k, v]) => `--${k}:${v}`).join(';')
  const scen = document.getElementById('scen')
  scen.classList.toggle('langt', s.langt)
  scen.innerHTML = `<aside class="spalt" style="${vars}">
    <h1>Bordet v0.7</h1>
    ${z.utanKod ? '' : '<div class="kod"><b>FMXMQ3</b><span class="qr"></span></div>'}
    <h2>PLATSER</h2>
    ${PLATSER.map(([id, namn, n, c]) => `<div class="plats" style="--c:${c}"><i>${id}</i><span><b>${namn}</b><span>${n} kort på hand</span><small>Inget ännu</small></span></div>`).join('')}
    <h2>SENAST</h2>
    <ol>${RADER.slice(0, z.rader).map((r, i) => `<li><b>${39 - i}</b>${r}</li>`).join('')}</ol>
  </aside>`
}
document.body.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.id === 'langt') { s.langt = !s.langt; return rita() }
  if (!b.dataset.v) return
  s.v = b.dataset.v; const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const alla = ['nu', 'a', 'b', 'c']
  s.v = alla[(alla.indexOf(s.v) + (e.key === 'ArrowRight' ? 1 : 3)) % 4]
  const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
const q = new URLSearchParams(location.search).get('v')
if (['nu', 'a', 'b', 'c'].includes(q)) s.v = q
rita()
</script>
</body>
</html>
