<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 16 — Zonen utanför bordet (#480 fynd 2)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan ──────────────────────────────────────────────────────────────────────────────
     På Bord-fliken kan en yta dras helt utanför bordet (1255, −200 mm på ett 900 mm-bord) utan
     ett ord. Handtaget klipps av filtens kant och blir onåbart med musen, och på bordet syns zonen
     inte alls. #478 fynd 7 (element utanför kortet) fick beslut A: elementets mitt hålls inom
     kortets kant, med en etikett som säger varför det stannade.

       Nu  zonen följer pekaren vart som helst
       A   zonens mitt hålls på bordet, en etikett säger varför (samma form som #478 A)
       B   hela zonen hålls på bordet
       C   fritt, men en zon som hamnat utanför står i bärnsten (L30) med «Hämta tillbaka»

     Dra ytan «Marknad» eller högen «Kasthög» förbi bordets kant, med mus eller piltangenter
     (Shift = 50 mm). Talen i raden överst är zonens i bordets millimetrar. ─────────────────── */
  body { display: flex; flex-direction: column; height: 100vh; }
  .scen { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: var(--chrome); overflow: hidden; }
  .filt { position: relative; width: 760px; height: 520px; border-radius: 16px; background: #14171d; overflow: hidden; }
  .bord { position: absolute; left: 80px; top: 60px; width: 600px; height: 400px; border-radius: 14px; background: radial-gradient(at 50% 40%, #2e6b46, #1f4a30 70%, #173a26); box-shadow: inset 0 0 40px rgb(0 0 0 / 45%); }
  .zon { position: absolute; box-sizing: border-box; border: 2px dashed #e8c77a; border-radius: 8px; color: #ffe9b8; font: 700 11px system-ui; letter-spacing: 1.5px; text-transform: uppercase; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .zon[data-kind='pile'] { border-style: solid; border-color: #cfd6e4; background: #e8eaf0; color: #0d0f14; border-radius: 6px; }
  .zon:focus-visible { outline: 2px solid var(--primary-mark); outline-offset: 3px; }
  .zon[data-off='true'] { border-color: var(--warn); background: rgb(240 182 74 / 18%); color: #ffd98a; }
  .etikett { position: absolute; z-index: 3; padding: 4px 8px; border-radius: 6px; background: #1f1b12; border: 1px solid #4a4230; color: #ffd98a; font: 12px system-ui; white-space: nowrap; pointer-events: none; }
  .varning { position: absolute; left: 12px; bottom: 12px; right: 12px; z-index: 4; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: #2a2417; border: 1px solid var(--warn); color: #ffd98a; font: 12px system-ui; }
  .varning button { min-height: 44px; border: 1px solid #5c4a1f; border-radius: 8px; padding: 0 12px; background: #241f13; color: #ffd98a; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="protorad">
  <div class="vaxlare" role="group" aria-label="Variant">
    <button type="button" data-v="nu">Nu</button>
    <button type="button" data-v="a">A</button>
    <button type="button" data-v="b">B</button>
    <button type="button" data-v="c">C</button>
  </div>
  <div class="fraga">
    <p><b>#480 fynd 2 · En zon som dras utanför bordet.</b> Dra ytan eller högen förbi den gröna kanten, eller välj den och använd piltangenterna.</p>
    <p>Samordnas med #478 fynd 7 (beslut A för element på kortet) och #484 fynd 1 (kort som släpps utanför i distansvyn).</p>
  </div>
  <div class="matt" id="matt"></div>
  <button type="button" id="aterstall">Börja om</button>
  <p class="anteckning" id="anteckning"></p>
</div>
<div class="scen"><div class="filt" id="filt"><div class="bord"></div></div></div>
<script>
// Bordet är 900 × 600 mm, ritat i 600 × 400 px: 1 mm = 2/3 px. Filten kring bordet är mörk.
const MM = 600 / 900, BX = 80, BY = 60, BORD = { w: 900, h: 600 }
const START = () => [
  { id: 'marknad', namn: 'Marknad', kind: 'area', x: 300, y: 60, w: 300, h: 120 },
  { id: 'kasthog', namn: 'Kasthög', kind: 'pile', x: 540, y: 320, w: 63, h: 88 },
]
const s = { v: 'a', zoner: START(), etikett: null }
const NOT = {
  nu: '<b>Nu.</b> Zonen följer pekaren vart som helst. <span class="minus">− Utanför bordet klipps handtaget av filtens kant och går inte att nå med musen; på bordet syns zonen inte.</span>',
  a: '<b>A · Mitten stannar på bordet.</b> Zonen får sticka ut över kanten, men dess mitt hålls innanför, och en etikett säger «stannade vid bordets kant». <span class="plus">+ Samma regel som #478 A för element på kortet: en regel för allt som dras. Zonen går alltid att ta i igen.</span> <span class="minus">− En yta kan fortfarande hänga halvvägs utanför bordet, och den halvan syns inte vid bordet.</span>',
  b: '<b>B · Hela zonen stannar på bordet.</b> Kanten är en vägg. <span class="plus">+ Det som står i uppställningen syns helt vid bordet, alltid.</span> <span class="minus">− En yta som är bredare än platsen kvar vid kanten kan inte läggas mot kanten; en annan regel än #478 A.</span>',
  c: '<b>C · Fritt, men sagt (L30).</b> Zonen får dras vart som helst, och en zon som ligger utanför står i bärnsten med en rad som säger det och «Hämta tillbaka». <span class="plus">+ Ingenting stoppar handen; samma form som L30:s bärnstensrad för kort som läggs utanför bordet.</span> <span class="minus">− Det onåbara uppstår först, och rättas sedan; raden måste nås med tangentbordet.</span>',
}
const filt = document.getElementById('filt')
const px = (mm) => mm * MM
function haller(z) {
  if (s.v === 'a') {
    const cx = Math.min(BORD.w, Math.max(0, z.x + z.w / 2)), cy = Math.min(BORD.h, Math.max(0, z.y + z.h / 2))
    return { x: cx - z.w / 2, y: cy - z.h / 2 }
  }
  if (s.v === 'b') return { x: Math.min(BORD.w - z.w, Math.max(0, z.x)), y: Math.min(BORD.h - z.h, Math.max(0, z.y)) }
  return { x: z.x, y: z.y }
}
const utanfor = (z) => z.x + z.w <= 0 || z.y + z.h <= 0 || z.x >= BORD.w || z.y >= BORD.h
const delvis = (z) => z.x < 0 || z.y < 0 || z.x + z.w > BORD.w || z.y + z.h > BORD.h
function flytta(z, x, y, fokus) {
  const vill = { ...z, x, y }
  const blev = haller(vill)
  s.etikett = (s.v === 'a' || s.v === 'b') && (blev.x !== x || blev.y !== y) ? z.id : null
  z.x = Math.round(blev.x); z.y = Math.round(blev.y)
  rita(fokus)
}
function rita(fokus) {
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === s.v))
  document.getElementById('anteckning').innerHTML = NOT[s.v]
  for (const el of filt.querySelectorAll('.zon, .etikett, .varning')) el.remove()
  for (const z of s.zoner) {
    const el = document.createElement('div')
    el.className = 'zon'; el.tabIndex = 0; el.dataset.id = z.id; el.dataset.kind = z.kind
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', `Zon ${z.namn}, ${z.x}, ${z.y} mm`)
    el.dataset.off = String(s.v === 'c' && delvis(z))
    Object.assign(el.style, { left: `${BX + px(z.x)}px`, top: `${BY + px(z.y)}px`, width: `${px(z.w)}px`, height: `${px(z.h)}px` })
    el.textContent = z.kind === 'pile' ? '' : z.namn
    filt.append(el)
    if (s.etikett === z.id) {
      const e = document.createElement('span')
      e.className = 'etikett'; e.textContent = `${z.namn} stannade vid bordets kant`
      Object.assign(e.style, { left: `${BX + px(z.x)}px`, top: `${BY + px(z.y) - 28}px` })
      filt.append(e)
    }
  }
  if (s.v === 'c') {
    const borta = s.zoner.filter(delvis)
    if (borta.length) {
      const w = document.createElement('div')
      w.className = 'varning'; w.setAttribute('role', 'status')
      w.innerHTML = `<span>${borta.map((z) => z.namn).join(' och ')} ${utanfor(borta[0]) ? 'ligger utanför bordet' : 'sticker ut över bordets kant'} och syns inte helt vid bordet.</span><button type="button" data-hamta>Hämta tillbaka</button>`
      filt.append(w)
    }
  }
  document.getElementById('matt').innerHTML = s.zoner.map((z) => `<span>${z.namn}: <u>${z.x}, ${z.y}</u> mm${utanfor(z) ? ' · <u>utanför</u>' : delvis(z) ? ' · delvis utanför' : ''}</span>`).join('')
  if (fokus) filt.querySelector(`[data-id="${fokus}"]`)?.focus()
}
let drag = null
filt.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.zon'); if (!el) return
  const z = s.zoner.find((x) => x.id === el.dataset.id)
  drag = { z, sx: e.clientX, sy: e.clientY, x: z.x, y: z.y }
  el.setPointerCapture(e.pointerId); e.preventDefault()
})
filt.addEventListener('pointermove', (e) => {
  if (!drag) return
  const dx = (e.clientX - drag.sx) / MM, dy = (e.clientY - drag.sy) / MM
  flytta(drag.z, Math.round((drag.x + dx) / 5) * 5, Math.round((drag.y + dy) / 5) * 5)
})
filt.addEventListener('pointerup', () => { drag = null; if (s.v !== 'c') { s.etikett = null; setTimeout(rita, 1200) } })
filt.addEventListener('keydown', (e) => {
  const el = e.target.closest('.zon'); if (!el) return
  const z = s.zoner.find((x) => x.id === el.dataset.id)
  const st = e.shiftKey ? 50 : 10
  const d = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key]
  if (!d) return
  e.preventDefault(); e.stopPropagation()
  flytta(z, z.x + d[0], z.y + d[1], z.id)
})
document.body.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.v) { s.v = b.dataset.v; s.zoner = START(); s.etikett = null; const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita() }
  else if (b.id === 'aterstall') { s.zoner = START(); s.etikett = null; rita() }
  else if (b.dataset.hamta !== undefined) {
    for (const z of s.zoner) { z.x = Math.min(BORD.w - z.w, Math.max(0, z.x)); z.y = Math.min(BORD.h - z.h, Math.max(0, z.y)) }
    rita(s.zoner[0].id)
  }
})
addEventListener('keydown', (e) => {
  if (e.target.closest('.zon, input')) return
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const alla = ['nu', 'a', 'b', 'c']
  s.v = alla[(alla.indexOf(s.v) + (e.key === 'ArrowRight' ? 1 : 3)) % 4]; s.zoner = START(); s.etikett = null
  const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
const q = new URLSearchParams(location.search).get('v')
if (['nu', 'a', 'b', 'c'].includes(q)) s.v = q
rita()
</script>
</body>
</html>
