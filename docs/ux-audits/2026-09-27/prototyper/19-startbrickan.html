<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 19 — Startbrickan under spelet (#482 fynd 3)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan ──────────────────────────────────────────────────────────────────────────────
     «Starta spelet» ligger på filten under högarna (K25, prototypat 2026-09-22) och ritas sist,
     ovanför allt annat. Kort som läggs där under spelet går inte att greppa: `elementFromPoint`
     svarar brickan. På seed-bordet låg «Goldrush Gus» 40 px under den hela spelet.

       Nu  brickan överst, hela spelet
       A   brickan under korten: den som ligger ovanpå vinner, brickan nås där den syns
       B   efter starten krymper brickan till en liten «Starta om» vid filtens nederkant
       C   efter starten lämnar brickan filten och blir en knapp i hörnklungan, bredvid «?»

     Tryck på brickan för att starta. Lägg kort på filten genom att klicka på en tom plats; klicka
     på ett kort för att «greppa» det — raden överst säger vad som greps. ──────────────────── */
  body { display: flex; flex-direction: column; height: 100vh; }
  .scen { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: #0f1218; }
  .ram { position: relative; width: 900px; height: 560px; }
  .filt { position: absolute; inset: 20px; border-radius: 18px; background: radial-gradient(at 50% 40%, #2e6b46, #1f4a30 70%, #173a26); box-shadow: inset 0 0 50px rgb(0 0 0 / 45%); overflow: hidden; }
  .hog, .kort { position: absolute; width: 63px; height: 88px; margin: -44px 0 0 -31.5px; border-radius: 6px; box-shadow: 0 2px 6px rgb(0 0 0 / 45%); }
  .hog { background: repeating-linear-gradient(45deg, #26324a 0 6px, #2d3a55 6px 12px); border: 2px solid #e8eaf0; }
  .hog i { position: absolute; left: 50%; top: -12px; translate: -50% 0; min-width: 26px; height: 26px; border-radius: 999px; background: #e8eaf0; color: #0d0f14; display: grid; place-items: center; font: 800 13px system-ui; font-style: normal; }
  .hog u { position: absolute; left: 50%; bottom: -22px; translate: -50% 0; text-decoration: none; color: rgb(255 255 255 / 80%); font: 11px system-ui; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .kort { background: #f4ead8; color: #111; font: 700 9px system-ui; padding: 6px; box-sizing: border-box; cursor: grab; }
  .kort[data-grepp] { outline: 3px solid #7dd3a0; outline-offset: 2px; }
  .bricka { position: absolute; left: 50%; top: 58%; translate: -50% 0; width: 190px; height: 52px; border: 0; border-radius: 999px; background: #1f6fd0; color: #fff; font: 700 17px system-ui; box-shadow: 0 6px 16px rgb(0 0 0 / 50%); cursor: pointer; }
  .bricka[data-liten] { top: auto; bottom: 14px; width: auto; height: 36px; padding: 0 14px; font-size: 13px; background: #1b1d23; border: 1px solid #6f7a90; box-shadow: none; }
  .klunga { position: absolute; right: 34px; bottom: 30px; display: flex; gap: 8px; align-items: center; }
  .klunga button { min-height: 40px; border: 1px solid #6f7a90; border-radius: 10px; background: #151924; color: #dce3f2; font: 700 13px system-ui; padding: 0 12px; cursor: pointer; }
  .klunga .fraga-tecken { width: 34px; height: 34px; min-height: 0; border-radius: 50%; padding: 0; }
</style>
</head>
<body>
<div class="protorad">
  <div class="vaxlare" role="group" aria-label="Variant">
    <button type="button" data-v="nu">Nu</button>
    <button type="button" data-v="a">A</button>
    <button type="button" data-v="b">B</button>
    <button type="button" data-v="c">C</button>
  </div>
  <div class="fraga">
    <p><b>#482 fynd 3 · Startbrickan under spelet.</b> Starta, lägg kort där brickan ligger, och försök greppa dem.</p>
    <p>K25 lade brickan under högarna och mätte bandet; frågan är vad den gör när spelet pågår.</p>
  </div>
  <div class="matt" id="matt"></div>
  <button type="button" id="aterstall">Börja om</button>
  <p class="anteckning" id="anteckning"></p>
</div>
<div class="scen"><div class="ram" id="ram"><div class="filt" id="filt"></div></div></div>
<script>
const START = () => ({ startat: false, kort: [{ id: 'k1', namn: 'Goldrush Gus', x: 430, y: 330 }, { id: 'k2', namn: 'Sheriff', x: 520, y: 320 }], grepp: null })
const s = { v: 'a', ...START() }
const NOT = {
  nu: '<b>Nu.</b> Brickan ligger överst hela spelet. <span class="minus">− Kort under den går inte att greppa; klicket går till brickan.</span>',
  a: '<b>A · Under korten.</b> Brickan ritas under allt som spelas: ett kort som läggs där ligger ovanpå och greppas. <span class="plus">+ Ingen ny form, brickan står kvar där K25 lade den.</span> <span class="minus">− Täckt av kort är brickan svårare att nå för en omstart.</span>',
  b: '<b>B · Liten efter starten.</b> När spelet startat krymper brickan till en diskret «Starta om» vid filtens nederkant, under allt. <span class="plus">+ Den stora ytan frigörs; en omstart är ett medvetet val.</span> <span class="minus">− Två former för samma knapp.</span>',
  c: '<b>C · I hörnklungan efter starten.</b> Brickan lämnar filten när spelet startat och blir «Starta om» bredvid «?». <span class="plus">+ Filten är helt spelarnas; omstarten står där annan bordsstyrning redan står.</span> <span class="minus">− Längre väg för den som vill starta om; en knapp mer i hörnet.</span>',
}
const filt = document.getElementById('filt')
function rita() {
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === s.v))
  document.getElementById('anteckning').innerHTML = NOT[s.v]
  const brickaPaFilten = !(s.v === 'c' && s.startat)
  const liten = s.v === 'b' && s.startat
  const ordning = s.v === 'nu' ? 10 : 1
  filt.innerHTML = `
    <div class="hog" style="left:360px;top:180px"><i>40</i><u>Draghög</u></div>
    <div class="hog" style="left:500px;top:180px"><i>0</i><u>Kasthög</u></div>
    ${brickaPaFilten ? `<button type="button" class="bricka" id="bricka" ${liten ? 'data-liten' : ''} style="z-index:${ordning}">${s.startat ? 'Starta om' : 'Starta spelet'}</button>` : ''}
    ${s.kort.map((k) => `<div class="kort" data-kort="${k.id}" ${s.grepp === k.id ? 'data-grepp' : ''} style="left:${k.x}px;top:${k.y}px;z-index:5">${k.namn}</div>`).join('')}
    ${s.v === 'c' && s.startat ? '<div class="klunga"><button type="button" id="omstart">Starta om</button><button type="button" class="fraga-tecken">?</button></div>' : ''}`
  document.getElementById('matt').innerHTML = `<span>Spelet: <u>${s.startat ? 'startat' : 'inte startat'}</u></span><span>Senast greppat: <u>${s.grepp ? s.kort.find((k) => k.id === s.grepp).namn : s.senast ?? '—'}</u></span>`
}
filt.addEventListener('click', (e) => {
  const b = e.target.closest('#bricka, #omstart')
  if (b) { if (!s.startat) s.startat = true; else s.senast = 'brickan (omstart)'; s.grepp = null; return rita() }
  const k = e.target.closest('[data-kort]')
  if (k) { s.grepp = k.dataset.kort; s.senast = null; return rita() }
  const r = filt.getBoundingClientRect()
  s.kort.push({ id: `k${s.kort.length + 1}`, namn: `Kort ${s.kort.length + 1}`, x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) })
  rita()
})
document.body.addEventListener('click', (e) => {
  const b = e.target.closest('[data-v], #aterstall'); if (!b) return
  if (b.dataset.v) s.v = b.dataset.v
  Object.assign(s, START(), { senast: null })
  const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
// The page's own z-order puts cards over the tile in A, B and C; in Nu the tile is over them.
const style = document.createElement('style'); document.head.append(style)
const orig = rita
rita = function () { orig(); style.textContent = s.v === 'nu' ? '.kort{z-index:5 !important}.bricka{z-index:10 !important}' : '' }
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const alla = ['nu', 'a', 'b', 'c']
  s.v = alla[(alla.indexOf(s.v) + (e.key === 'ArrowRight' ? 1 : 3)) % 4]; Object.assign(s, START(), { senast: null })
  const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
const q = new URLSearchParams(location.search).get('v')
if (['nu', 'a', 'b', 'c'].includes(q)) s.v = q
rita()
</script>
</body>
</html>
