<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp 26 — Motståndarens drag (#484 fynd 12)</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ── Frågan ──────────────────────────────────────────────────────────────────────────────
     När en motståndare flyttar ett kort ringas det i platsens färg i 1,6 s (`RECENT_MS` i
     `table/presence.ts`) och sedan inte alls; vad som hände står bara i skärmläsarregionen
     (`useActivityLive`). Den som tittade bort när Bo spelade ser en filt som ändrat sig och
     ingenting som säger hur. TV:n har SENAST-flödet (K9) och telefonen «Senast» (C4); distansvyn,
     där man sitter ensam med bordet, har ingenting synligt.

       Nu  ringen i 1,6 s, sedan bara skärmläsaren
       A   en tyst rad i listen: «Senast: Bo lade Duel på Kasthög», kvar tills nästa drag
       B   det flyttade kortet behåller sin ring i platsens färg tills du själv gör något
       C   ett litet flöde med de tre senaste dragen vid filtens kant, som TV:ns SENAST

     Fönstret är 1280 × 800 i verklig storlek, skalat; filten är förenklad. «Nästa drag» låter en
     motståndare göra något, «Du gör något» är ditt eget drag. ─────────────────────────────── */
  body { display: flex; flex-direction: column; height: 100vh; }
  .scen { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; background: #0a0c10; overflow: hidden; }
  .fonster { position: relative; width: 1280px; height: 800px; background: #17120f; transform-origin: 0 0; overflow: hidden; font-family: system-ui, sans-serif; }
  .topp { position: absolute; left: 0; top: 0; right: 0; height: 61px; display: flex; align-items: center; gap: 8px; padding: 8px 16px; box-sizing: border-box; background: #100d0b; border-bottom: 1px solid #2a221c; }
  .jag { flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: rgb(20 22 28 / 90%); color: #9aa3b8; font-size: 13px; border-left: 4px solid #e05d5d; }
  .jag strong { color: #fff; font-size: 15px; }
  .topp button { flex: none; min-height: 44px; padding: 0 14px; border: 1px solid #3a2f26; border-radius: 10px; background: #1d1815; color: #e8e2d8; font: 700 13px system-ui; }
  .topp .verktyg { flex: none; margin-left: auto; display: flex; gap: 6px; }
  .topp .verktyg button { border: 0; background: rgb(36 41 56 / 92%); color: #fff; }
  .senast { flex: 1 1 auto; min-width: 0; margin-left: 16px; color: #9aa3b8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .senast b { color: var(--c); }
  .senast em { font-style: normal; color: #e8e2d8; }
  .senast small { color: #6f778a; font-size: 12px; margin-left: 8px; }
  .tra { position: absolute; border-radius: 26px; background: linear-gradient(#5a3a22, #3e2716); box-shadow: 0 18px 40px rgb(0 0 0 / 55%); }
  .filt { position: absolute; border-radius: 12px; background: radial-gradient(at 50% 40%, #2e6b46, #1f4a30 70%, #173a26); }
  .zon { position: absolute; box-sizing: border-box; border: 1.5px solid rgb(232 234 220 / 28%); border-radius: 6px; }
  .zon > u { position: absolute; left: 4px; top: -17px; text-decoration: none; color: rgb(232 234 220 / 60%); font: 700 10px system-ui; letter-spacing: 1.2px; text-transform: uppercase; white-space: nowrap; }
  .kort, .hog { position: absolute; width: 47px; height: 66px; box-sizing: border-box; border-radius: 4px; }
  .kort { background: #232a3a; color: #eef2fb; font: 700 7px system-ui; padding: 3px; display: grid; place-items: center; text-align: center; overflow: hidden; box-shadow: 0 2px 5px rgb(0 0 0 / 45%); }
  .hog { background: repeating-linear-gradient(45deg, #26324a 0 5px, #2d3a55 5px 10px); border: 1.5px solid #e8eaf0; }
  .hog > .kort { inset: 0; left: 0; top: 0; }
  .hog > b { position: absolute; left: 50%; bottom: -26px; translate: -50% 0; padding: 2px 9px; border-radius: 999px; background: #0f2418; color: #e8eadc; font: 700 12px system-ui; white-space: nowrap; }
  [data-ring] { outline: 3px solid var(--c); outline-offset: 2px; }
  [data-ring]::after { content: attr(data-ring); position: absolute; right: -8px; top: -12px; padding: 0 6px; border-radius: 999px; background: var(--c); color: #10131a; font: 800 10px/16px system-ui; }
  .flakt i { position: absolute; width: 30px; height: 42px; border-radius: 3px; background: repeating-linear-gradient(45deg, #26324a 0 4px, #2d3a55 4px 8px); border: 1px solid #3b4a6b; }
  .namn { position: absolute; padding: 2px 10px; border-radius: 999px; background: var(--c); color: #10131a; font: 800 12px system-ui; white-space: nowrap; transform: translate(-50%, -50%); }
  .antal { position: absolute; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #0c0e13; color: #fff; font: 800 12px system-ui; display: grid; place-items: center; transform: translate(-50%, -50%); }
  .kolumn { position: absolute; right: 0; top: 61px; bottom: 0; width: 136px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .kolumn i { width: 112px; height: 156px; box-sizing: border-box; border-radius: 10px; padding: 10px; margin-bottom: -88px; background: #232a3a; color: #eef2fb; font: 700 15px system-ui; font-style: normal; text-align: center; box-shadow: 0 6px 16px rgb(0 0 0 / 50%); }
  .kolumn i:last-child { margin-bottom: 0; }
  .flode { position: absolute; left: 14px; bottom: 14px; width: 300px; padding: 8px 12px; box-sizing: border-box; border-radius: 12px; background: rgb(12 14 19 / 88%); border: 1px solid #262b38; color: #9aa3b8; font-size: 12px; }
  .flode h2 { margin: 0 0 4px; font-size: 10px; letter-spacing: 1.5px; color: #7d8597; }
  .flode ol { list-style: none; margin: 0; padding: 0; }
  .flode li { padding: 3px 0; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flode li:first-child { font-size: 13px; font-weight: 600; }
  .flode li b { color: #4c5468; font: 400 11px ui-monospace, monospace; margin-right: 6px; }
  .protorad .sr { flex: 1 1 100%; margin: 0; color: #c8b98d; }
  .protorad .sr code { color: #ffe9b8; }
</style>
</head>
<body>
<div class="protorad">
  <div class="vaxlare" role="group" aria-label="Variant">
    <button type="button" data-v="nu">Nu</button>
    <button type="button" data-v="a">A</button>
    <button type="button" data-v="b">B</button>
    <button type="button" data-v="c">C</button>
  </div>
  <button type="button" id="nasta">Nästa drag (motståndare)</button>
  <button type="button" id="eget">Du gör något</button>
  <button type="button" id="aterstall">Börja om</button>
  <div class="fraga">
    <p><b>#484 fynd 12 · Vad motståndaren just gjorde.</b> Tryck «Nästa drag», titta bort två sekunder, och försök sedan säga vad som hände.</p>
  </div>
  <div class="matt" id="matt"></div>
  <p class="sr" id="sr"></p>
  <p class="anteckning" id="anteckning"></p>
</div>
<div class="scen" id="scen"><div class="fonster" id="fonster"></div></div>
<script>
const W = 1280, H = 800, TOPP = 61, KOL = 136, RECENT_MS = 1600
const MM = 47 / 63
const FILT = { w: 1200 * MM, h: 800 * MM }
FILT.x = (W - KOL - FILT.w) / 2
FILT.y = TOPP + (H - TOPP - FILT.h) / 2
const P = { B: { namn: 'Bo', c: '#3c8ce7' }, C: { namn: 'Cy', c: '#3fb27f' }, D: { namn: 'Di', c: '#e0a93b' }, A: { namn: 'Ada', c: '#e05d5d' } }
const px = (x, y) => ({ x: FILT.x + x * MM, y: FILT.y + y * MM })
const DRAG = [
  { plats: 'B', text: 'lade Duel på Kasthög', kort: 'Duel', till: 'kasthog' },
  { plats: 'C', text: 'lade Sheriff framför sig', kort: 'Sheriff', till: 'framfor-c' },
  { plats: 'D', text: 'drog 1 kort från Kortlek', till: 'kortlek' },
  { plats: 'B', text: 'lade Tumbleweed i Sal’s Saloon', kort: 'Tumbleweed', till: 'saloon' },
]
const START = () => ({ i: 0, lagda: [{ id: 'f1', namn: 'Saloon Brawl', zon: 'saloon', x: 380, y: 120 }], kasthog: { n: 3, topp: 'Fact or Fable' }, kortlek: 124, antal: { B: 3, C: 3, D: 3 }, logg: [], senast: null, egen: 0 })
const s = { v: 'a', ...START() }
const NOT = {
  nu: '<b>Nu.</b> Kortet ringas i platsens färg i 1,6 s och sedan inte alls. <span class="minus">− Den som blinkade missade det; ett drag från en hög syns bara som ett tal som ändrats; skärmläsaren hör raden, ögat inte.</span>',
  a: '<b>A · En tyst rad i listen.</b> «Senast: Bo lade Duel på Kasthög» mellan «Visa alla» och verktygen, namnet i platsens färg, kvar tills nästa drag. Samma rad som skärmläsaren hör. <span class="plus">+ Kostar ingen filt och ingen kortstorlek (listen finns redan); läses när man tittar upp; drag från högar sägs också.</span> <span class="minus">− Bara det senaste; vid 768 × 1024 är raden ~260 px och kortas med «…».</span>',
  b: '<b>B · Kortet behåller sin ring.</b> Det flyttade kortet står kvar ringat i platsens färg, med platsens bokstav, tills du själv gör något. <span class="plus">+ Pekar på stället; ingen text att läsa.</span> <span class="minus">− Säger var men inte vad eller varifrån; ett drag ur en hög eller in i en hand har inget kort att ringa; en ring som står kvar ser ut som ett val, vilket K14 säger att filten inte har.</span>',
  c: '<b>C · Flöde vid filtens kant.</b> De tre senaste dragen i ett litet SENAST nere till vänster, numrerade och i platsens färg, som TV:ns (K9). <span class="plus">+ Tre drag bakåt — det som hände medan man hämtade kaffe; samma form som TV:n och telefonens «Senast».</span> <span class="minus">− Ligger över filtens hörn, där räknarna står på ett riktigt bord; K9:s regel att krom inte rör filten bryts, eller filten krymper för att ge plats.</span>',
}
function rita() {
  for (const b of document.querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', String(b.dataset.v === s.v))
  document.getElementById('anteckning').innerHTML = NOT[s.v]
  const nu = performance.now()
  const sen = s.senast
  const farsk = sen && nu - sen.t < RECENT_MS
  const ringKvar = sen && (farsk || (s.v === 'b' && s.egen < sen.t))
  const ring = (mal) => (ringKvar && sen.till === mal ? ` data-ring="${P[sen.plats].namn[0]}"` : '')
  const zon = (id, namn, x, y, w, h) => { const a = px(x, y); return `<div class="zon" style="left:${a.x}px;top:${a.y}px;width:${w * MM}px;height:${h * MM}px"><u>${namn}</u></div>` }
  const kl = px(440, 350), kh = px(700, 350)
  const lagda = s.lagda.map((k) => { const a = px(k.x, k.y); const r = ringKvar && sen.kortId === k.id; return `<div class="kort"${r ? ` data-ring="${P[sen.plats].namn[0]}"` : ''} style="left:${a.x}px;top:${a.y}px${r ? `;--c:${P[sen.plats].c}` : ''}">${k.namn}</div>` }).join('')
  const hander = [['B', 600, 10, 0], ['C', 1180, 400, 90], ['D', 20, 400, 90]].map(([id, x, y, rot]) => {
    const a = px(x, y)
    const fl = [0, 1, 2].map((i) => `<i style="left:${a.x - 15 + (rot ? 0 : (i - 1) * 12)}px;top:${a.y - 21 + (rot ? (i - 1) * 12 : 0)}px;transform:rotate(${rot + (i - 1) * 8}deg)"></i>`).join('')
    const r = ringKvar && sen.till === 'kortlek' && sen.plats === id
    return `<div class="flakt">${fl}</div><span class="namn" style="--c:${P[id].c};left:${a.x + (id === 'C' ? -44 : id === 'D' ? 44 : 0)}px;top:${a.y + (id === 'B' ? 36 : 0)}px">${P[id].namn}</span><span class="antal" style="left:${a.x + (id === 'C' ? 30 : id === 'D' ? -30 : 0)}px;top:${a.y + (id === 'B' ? -22 : 0)}px${r ? `;outline:3px solid ${P[id].c}` : ''}">${s.antal[id]}</span>`
  }).join('')
  const eget = px(600, 790)
  const senastRad = s.v === 'a' ? `<span class="senast" role="status">${sen ? `Senast: <b style="--c:${P[sen.plats].c}">${P[sen.plats].namn}</b> <em>${sen.text}</em><small>för ${Math.round((nu - sen.t) / 1000)} s sedan</small>` : ''}</span>` : ''
  const flode = s.v === 'c' && s.logg.length ? `<div class="flode"><h2>SENAST</h2><ol>${s.logg.slice(0, 3).map((l) => `<li style="--c:${P[l.plats].c}"><b>${l.nr}</b>${P[l.plats].namn} ${l.text}</li>`).join('')}</ol></div>` : ''
  document.getElementById('fonster').innerHTML = `
    <div class="topp"><span class="jag"><strong>Ada</strong><span>3 kort</span></span><button type="button">Visa alla</button>${senastRad}<span class="verktyg"><button type="button">↶ Ångra</button><button type="button">⚑ Flagga</button><button type="button">Ut…</button></span></div>
    <div class="tra" style="left:${FILT.x - 30}px;top:${FILT.y - 30}px;width:${FILT.w + 60}px;height:${FILT.h + 60}px"></div>
    <div class="filt" style="left:${FILT.x}px;top:${FILT.y}px;width:${FILT.w}px;height:${FILT.h}px"></div>
    ${zon('saloon', 'Sal’s Saloon', 330, 110, 540, 130)}${zon('framfor-a', 'Framför A', 330, 560, 540, 140)}${zon('framfor-d', 'Framför D', 110, 150, 150, 500)}${zon('framfor-c', 'Framför C', 940, 150, 150, 500)}
    <div class="hog"${ring('kortlek')} style="left:${kl.x}px;top:${kl.y}px${ringKvar && sen.till === 'kortlek' ? `;--c:${P[sen.plats].c}` : ''}"><b>Kortlek · ${s.kortlek}</b></div>
    <div class="hog"${ringKvar && sen.till === 'kasthog' ? ` data-ring="${P[sen.plats].namn[0]}"` : ''} style="left:${kh.x}px;top:${kh.y}px${ringKvar && sen.till === 'kasthog' ? `;--c:${P[sen.plats].c}` : ''}"><div class="kort">${s.kasthog.topp}</div><b>Kasthög · ${s.kasthog.n}</b></div>
    ${lagda}${hander}
    <span class="namn" style="--c:#e05d5d;left:${eget.x}px;top:${eget.y - 20}px">Ada</span>
    <div class="kolumn"><i>High Noon</i><i>The Alley</i><i>Bullseye</i></div>${flode}`
  const syns = !sen ? '—' : s.v === 'a' || s.v === 'c' ? 'ja, kvar' : ringKvar ? (farsk ? 'ja, ringen' : 'ja, ringen tills du gör något') : 'nej'
  document.getElementById('matt').innerHTML = `<span>Draget syns: <u>${syns}</u></span><span>Sedan draget: <u>${sen ? `${((nu - sen.t) / 1000).toFixed(1).replace('.', ',')} s` : '—'}</u></span>`
  document.getElementById('sr').innerHTML = `Skärmläsarregionen: <code>${sen ? `${P[sen.plats].namn} ${sen.text}` : '—'}</code>`
  skala()
}
function skala() {
  const scen = document.getElementById('scen'), f = document.getElementById('fonster')
  const k = Math.min((scen.clientWidth - 20) / W, (scen.clientHeight - 20) / H)
  f.style.transform = `scale(${k})`
  f.style.marginRight = `${W * k - W}px`; f.style.marginBottom = `${H * k - H}px`
}
function nasta() {
  const d = DRAG[s.i % DRAG.length]
  const t = performance.now()
  let kortId = null
  if (d.till === 'kasthog') { s.kasthog = { n: s.kasthog.n + 1, topp: d.kort }; s.antal[d.plats]-- }
  else if (d.till === 'kortlek') { s.kortlek--; s.antal[d.plats]++ }
  else {
    const n = s.lagda.filter((k) => k.zon === d.till).length
    kortId = `k${s.i}`
    s.lagda.push(d.till === 'framfor-c' ? { id: kortId, namn: d.kort, zon: d.till, x: 990, y: 200 + n * 110 } : { id: kortId, namn: d.kort, zon: d.till, x: 380 + n * 120, y: 120 })
    s.antal[d.plats]--
  }
  s.i++
  s.senast = { ...d, t, kortId }
  s.logg.unshift({ ...d, nr: 40 + s.i })
  rita()
}
setInterval(() => { if (s.senast) rita() }, 250)
document.body.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.id === 'nasta') return nasta()
  if (b.id === 'eget') { s.egen = performance.now(); return rita() }
  if (b.id === 'aterstall') { Object.assign(s, START()); return rita() }
  if (!b.dataset.v) return
  s.v = b.dataset.v; const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const alla = ['nu', 'a', 'b', 'c']
  s.v = alla[(alla.indexOf(s.v) + (e.key === 'ArrowRight' ? 1 : 3)) % 4]
  const u = new URL(location.href); u.searchParams.set('v', s.v); history.replaceState(null, '', u); rita()
})
addEventListener('resize', rita)
const q = new URLSearchParams(location.search).get('v')
if (['nu', 'a', 'b', 'c'].includes(q)) s.v = q
rita()
</script>
</body>
</html>
